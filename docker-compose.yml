name: mskbanew

services:
  phpfpm:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: mskbanew-phpfpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -lc "
      [ -f vendor/autoload.php ] || composer install --no-dev --optimize-autoloader &&
      php-fpm
      "

  nginx:
    image: nginx:1.27-alpine
    container_name: mskbanew-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpfpm

  db:
    image: postgres:17-alpine
    container_name: mskbanew-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mskbanew}
      POSTGRES_USER: ${DB_USERNAME:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dev} -d ${DB_DATABASE:-mskbanew}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mskbanew-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
    name: mskba_postgres_data
  redis_data:
