name: mskbabrandnew

services:
  phpfpm:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: mskbabrandnew-phpfpm
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      MAIL_HOST: mailpit
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php-fpm"]

  nginx:
    image: nginx:1.27-alpine
    container_name: mskbabrandnew-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpfpm

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: mskbabrandnew-queue
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      MAIL_HOST: mailpit
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]

  db:
    image: postgres:17-alpine
    container_name: mskbabrandnew-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mskbabrandnew}
      POSTGRES_USER: ${DB_USERNAME:-mskbabrandnew}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mskbabrandnew} -d ${DB_DATABASE:-mskbabrandnew}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: mskbabrandnew-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: mskbabrandnew-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    container_name: mskbabrandnew-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres-data:
  redis_data:
