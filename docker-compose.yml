name: mskba

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: mskba-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -lc "
      [ -f vendor/autoload.php ] || composer install --no-dev --optimize-autoloader &&
      php artisan config:clear &&
      php artisan migrate --force &&
      php-fpm
      "

  nginx:
    image: nginx:1.27-alpine
    container_name: mskba-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: mskba-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mskba
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d mskba"]
      interval: 5s
      timeout: 5s
      retries: 10

  build:
    image: node:22-alpine
    container_name: mskba-build
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: >
      sh -lc "
      npm ci &&
      npm run build
      "
    profiles:
      - build

volumes:
  postgres_data:
  node_modules: