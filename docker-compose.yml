name: mskbabrandnew

services:
  postgres:
    image: postgres:17-alpine
    container_name: mskbabrandnew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mskbabrandnew
      POSTGRES_USER: mskbabrandnew
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mskbabrandnew -d mskbabrandnew"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: mskbabrandnew-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
