name: mskba-dev

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  working_dir: /var/www/html
  restart: unless-stopped
  environment: &app-env
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    CACHE_STORE: redis
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    GOTENBERG_URL: http://gotenberg:3000
  volumes:
    - .:/var/www/html
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  phpfpm:
    <<: *app
    command: ["php-fpm"]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_NGINX_PORT:-8001}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpfpm
      - reverb
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    profiles: ["workers"]
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    profiles: ["workers"]
  reverb:
    <<: *app
    environment:
      <<: *app-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in server .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in server .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in server .env}
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dev_redis:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  dev_postgres:
  dev_redis:
