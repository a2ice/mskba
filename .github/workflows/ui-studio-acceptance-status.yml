name: UI Studio live acceptance status (read-only)

on:
  push:
    branches: [ops/ui-studio-995-preflight]
    paths: [.github/workflows/ui-studio-acceptance-status.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live UI Studio vhost and feature-gate status
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            VHOST=/etc/nginx/sites-enabled/mskba-ui
            UI_ENV=/var/www/mskba-ui/.env
            PORTAL_ENV=/var/www/mskba/.env
            echo 'UI_STUDIO_LIVE_STATUS_BEGIN'
            if grep -Fq '# MSKBA_UI_STUDIO_SSO_V1' "$VHOST"; then
              echo 'NGINX_BRIDGE_PATCH=APPLIED'
            else
              echo 'NGINX_BRIDGE_PATCH=NOT_APPLIED'
            fi
            for expected in 'SESSION_DRIVER=file' 'CACHE_STORE=file' 'SESSION_COOKIE=mskba_ui_session'; do
              if grep -Fxq "$expected" "$UI_ENV"; then
                echo "STUDIO_ENV_$(printf '%s' "$expected" | cut -d= -f1)=EXPECTED"
              else
                echo "STUDIO_ENV_$(printf '%s' "$expected" | cut -d= -f1)=NOT_EXPECTED"
              fi
            done
            if grep -Fxq 'UI_STUDIO_BRIDGE_ENABLED=true' "$PORTAL_ENV"; then
              echo 'PORTAL_BRIDGE=ENABLED'
            else
              echo 'PORTAL_BRIDGE=DISABLED'
            fi
            for target in /uikit /uikit/bridge /uikit/session /uikit/reviews; do
              case "$target" in
                /uikit/session|/uikit/reviews)
                  method=POST
                  code="$(curl --silent --show-error --max-time 8 --output /dev/null --write-out '%{http_code}' --request POST -H 'Accept: application/json' --data '{}' "https://ui.mskba.ru$target" || true)"
                  ;;
                *)
                  method=GET
                  code="$(curl --silent --show-error --max-time 8 --output /dev/null --write-out '%{http_code}' "https://ui.mskba.ru$target" || true)"
                  ;;
              esac
              echo "HTTP_$method$target=$code"
            done
            echo "STUDIO_HEAD=$(git -C /var/www/mskba-ui rev-parse --short HEAD)"
            echo '--- SSO SECURITY PREFLIGHT ---'
            if grep -Fq 'MSKBA_UI_STUDIO_SSO_V1' "$VHOST"; then echo 'SSO_NGINX_MARKER=OK'; else echo 'SSO_NGINX_MARKER=MISSING'; fi
            if grep -Fq 'auth_basic off;' "$VHOST"; then echo 'SSO_NGINX_EXEMPTIONS=FOUND'; else echo 'SSO_NGINX_EXEMPTIONS=NONE'; fi
            if grep -Fq 'mskba_ui_session=$cookie_mskba_ui_session' "$VHOST"; then echo 'SSO_NGINX_COOKIE_FORWARDING=FOUND'; else echo 'SSO_NGINX_COOKIE_FORWARDING=NONE'; fi
            ui_secret="$(grep -m1 '^UI_STUDIO_BRIDGE_SECRET=' "$UI_ENV" | cut -d= -f2- || true)"
            prod_secret="$(grep -m1 '^UI_STUDIO_BRIDGE_SECRET=' "$PORTAL_ENV" | cut -d= -f2- || true)"
            if [ "${#ui_secret}" -ge 32 ] && [ "$ui_secret" = "$prod_secret" ]; then
              echo 'SSO_SHARED_HMAC_SECRET=MATCHED'
            else
              echo 'SSO_SHARED_HMAC_SECRET=NOT_READY'
            fi
            unset ui_secret prod_secret
            echo '--- NGINX VHOST FILE IDENTITY ---'
            for p in /etc/nginx/sites-enabled/mskba-ui /etc/nginx/sites-available/mskba-ui; do
              if [ -e "$p" ]; then
                echo "VHOST_PATH=$p"
                stat -c 'VHOST_TYPE=%F OWNER=%U MODE=%a INODE=%i' "$p" || true
                echo "VHOST_REALPATH=$(readlink -f "$p" || true)"
                sha256sum "$p" | sed 's@ .*$@ [PATH HIDDEN]@'
                grep -E -n 'MSKBA_UI_STUDIO_SSO_V1|auth_basic off|HTTP_COOKIE|location .*uikit' "$p" | cut -c1-180 || true
              else
                echo "VHOST_PATH_NOT_FOUND=$p"
              fi
            done
            echo 'UI_STUDIO_LIVE_STATUS_END'
