name: Feature 106 verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, sqlite3, mbstring, intl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP formatting
        run: |
          vendor/bin/pint --test \
            app/Modules/Event/Presentation/Http/Controllers/EventWizardController.php \
            routes/event-wizard.php \
            tests/Feature/Event/EventCreationWizardTest.php

      - name: Run wizard tests
        run: php artisan test --compact tests/Feature/Event/EventCreationWizardTest.php

      - name: Run regression suite
        # Two pre-existing Telegram groups are sensitive to shared test-process
        # configuration/state. Exclude them from the broad pass and run both
        # independently below. No test is omitted overall.
        run: php artisan test --compact --filter '/^(?!.*TelegramEventIntegrationTest)(?!.*test_legacy_telegram_integration_page_remains_available).*$/'

      - name: Run Telegram event integration tests in isolation
        run: php artisan test --compact tests/Feature/Telegram/TelegramEventIntegrationTest.php

      - name: Run legacy Telegram rendering assertion in isolation
        env:
          TELEGRAM_BOT_USERNAME: MSKBABot
        run: php artisan test --compact tests/Feature/Telegram/TelegramMiniAppAuthTest.php --filter test_legacy_telegram_integration_page_remains_available

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
