name: One-time MSKBA venue map zoom/chevron publication

on:
  push:
    branches:
      - ops/publish-map-zoom-chevrons-20261020
    paths:
      - .github/workflows/publish-map-zoom-chevrons-20261020.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 18
    steps:
      - name: Validate existing map revisions, back up dev database, publish CSS and JS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /var/www/mskba-dev-next
            grep -qx 'APP_ENV=staging' .env
            grep -qx 'APP_URL=https://dev.mskba.ru' .env
            test -f compose.dev.local.yaml
            test "$(git rev-parse HEAD)" = '84d625c36c80620768664b3cd96321a52b46be38' || {
              echo 'Unexpected dev commit, refusing Page Builder publication'; exit 1;
            }
            COMPOSE=(docker compose --env-file .env -f compose.dev.yaml -f compose.dev.local.yaml)
            "${COMPOSE[@]}" config --quiet
            CHECK="$("${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:zoom-chevrons --check)"
            if [ "$CHECK" = 'ALREADY' ]; then
              echo 'Zoom/chevron adjustment already published; no changes.'
              exit 0
            fi
            test "$CHECK" = 'READY' || { echo 'Unexpected CMS baseline; refusing overwrite'; exit 1; }
            umask 077
            BACKUP_DIR="/home/deploy/mskba-page-builder-backups/venues-map-zoom-chevrons-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p -m 700 "$BACKUP_DIR"
            DUMP="$BACKUP_DIR/mskba-dev-before-map-zoom-chevrons.dump"
            "${COMPOSE[@]}" exec -T db sh -c \
              'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc --no-owner --no-acl' > "$DUMP"
            test -s "$DUMP"
            test "$(stat -c %s "$DUMP")" -gt 1024
            "${COMPOSE[@]}" exec -T db pg_restore -l < "$DUMP" > "$BACKUP_DIR/pg_restore.list"
            test -s "$BACKUP_DIR/pg_restore.list"
            sha256sum "$DUMP" > "$BACKUP_DIR/SHA256SUMS"
            ( cd "$BACKUP_DIR" && sha256sum -c SHA256SUMS )
            echo "BACKUP VERIFIED: $BACKUP_DIR"
            APPLY="$("${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:zoom-chevrons --apply)"
            test "$APPLY" = 'PUBLISHED' || { echo 'Map publication did not complete'; exit 1; }
            AFTER="$("${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:zoom-chevrons --check)"
            test "$AFTER" = 'ALREADY' || { echo 'Unexpected post-publication state'; exit 1; }
            curl -fsS --max-time 15 -o /dev/null 'https://dev.mskba.ru/'
            echo 'PASS: map zoom decreased one step; filters centered; versioned CSS/JS published on dev.'
