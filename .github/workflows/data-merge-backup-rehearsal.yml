name: MSKBA isolated backup restore rehearsal

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/data-merge-backup-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mskba-data-merge-backup-rehearsal
  cancel-in-progress: false

jobs:
  production:
    name: Backup and restore prod snapshot in isolated Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backup script syntax
        run: bash -n scripts/data-merge/backup-restore-rehearsal.sh
      - name: Stage approved backup script outside production webroot
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: scripts/data-merge/backup-restore-rehearsal.sh
          target: /home/deploy/mskba-data-merge-tools/${{ github.run_id }}
      - name: Backup and fully restore production snapshot without source writes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            bash /home/deploy/mskba-data-merge-tools/${{ github.run_id }}/scripts/data-merge/backup-restore-rehearsal.sh prod ${{ github.run_id }}

  development:
    name: Backup and restore dev snapshot in isolated Postgres
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Check backup script syntax
        run: bash -n scripts/data-merge/backup-restore-rehearsal.sh
      - name: Stage approved backup script outside dev webroot
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: scripts/data-merge/backup-restore-rehearsal.sh
          target: /home/deploy/mskba-data-merge-tools/${{ github.run_id }}
      - name: Backup and fully restore development snapshot without source writes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            bash /home/deploy/mskba-data-merge-tools/${{ github.run_id }}/scripts/data-merge/backup-restore-rehearsal.sh dev ${{ github.run_id }}
