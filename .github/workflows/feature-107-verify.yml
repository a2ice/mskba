name: Feature 107 verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Verify creation permissions
        run: php artisan test --compact tests/Feature/Identity/CreationOperationalPermissionTest.php

      - name: Run PHP regression suite
        shell: bash
        run: |
          mapfile -t test_files < <(find tests -type f -name '*Test.php' ! -path 'tests/Feature/Telegram/TelegramMiniAppAuthTest.php' | sort)
          php artisan test --compact "${test_files[@]}"

      - name: Verify Telegram mini app separately
        env:
          TELEGRAM_BOT_USERNAME: mskba_test_bot
        run: php artisan test --compact tests/Feature/Telegram/TelegramMiniAppAuthTest.php

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
