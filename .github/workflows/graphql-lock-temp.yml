name: GraphQL Composer Lock (temporary)
on:
  push:
    branches:
      - feature/graphql-lighthouse-20261022
    paths:
      - composer.json
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, gd, intl, zip
      - name: Update only Lighthouse and required dependencies
        run: |
          composer update nuwave/lighthouse --with-all-dependencies --minimal-changes --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish
      - name: Commit updated composer.lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git diff --cached --quiet && exit 0
          git commit -m 'build(graphql): lock Lighthouse dependency'
          git push origin HEAD:feature/graphql-lighthouse-20261022
