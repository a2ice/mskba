name: Swagger UI npm dependency lock (temporary)
on:
  push:
    branches:
      - feature/openapi-swagger-filament-20261022
    paths:
      - .github/workflows/swagger-lock-temp.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update package lock and validate Vite bundle
        env:
          SCARF_ANALYTICS: 'false'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Commit npm lock to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build(api-docs): lock Swagger UI distribution'
          git push origin HEAD:feature/openapi-swagger-filament-20261022
