name: Task 123 verification

on:
  push:
    branches:
      - feature/123

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: JavaScript syntax
        run: |
          node --check resources/themes/mskba_dark/js/features/player-character-procedural-male.js
          node --check resources/themes/mskba_dark/js/features/player-character-three-renderer.js

      - name: Production frontend build
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Player Character feature tests
        run: |
          php artisan test tests/Feature/Identity/AccountPlayerCharacterStageTest.php
          php artisan test tests/Feature/Identity/AccountPlayerCharacterAppearanceTest.php
