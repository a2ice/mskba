name: Verify Task 111

on:
  push:
    branches:
      - feature/111-telegram-event-participation
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test app/Modules/Event/Application/Services/StandaloneGamePlayerWithdrawalService.php app/Modules/Event/Application/Services/StandaloneGameQrJoinService.php app/Modules/Event/Application/UseCases/ShowEventHandler.php app/Modules/Telegram/Application/Services/TelegramEventMessageBuilder.php app/Modules/Telegram/Application/UseCases/HandleEventParticipationCallback.php app/Modules/Telegram/Infrastructure/Jobs/SyncTelegramEventPublicationJob.php tests/Feature/Telegram/TelegramEventParticipationModeTest.php

      - name: Task 111 tests
        run: php artisan test tests/Feature/Telegram/TelegramEventParticipationModeTest.php

      - name: Existing QR and recruitment regression
        run: php artisan test tests/Feature/Event/StandaloneGameQrJoinTest.php tests/Feature/Event/StandaloneGameRecruitmentWorkflowTest.php

      - name: Event page regression
        run: php artisan test tests/Feature/Event/EventWorkflowTest.php

      - name: Existing Telegram integration isolated
        env:
          TELEGRAM_BOT_USERNAME: MSKBABot
        run: php artisan test tests/Feature/Telegram/TelegramEventIntegrationTest.php

      - name: Frontend build
        run: |
          npm ci
          npm run build
