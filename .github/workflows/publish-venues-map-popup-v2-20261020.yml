name: One-time guarded Venues Map V2 publication

on:
  push:
    branches:
      - ops/publish-venues-map-popup-v2-20261020
    paths:
      - .github/workflows/publish-venues-map-popup-v2-20261020.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 18
    steps:
      - name: Back up verified dev PostgreSQL and publish only the unchanged map component
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /var/www/mskba-dev-next
            grep -qx 'APP_ENV=staging' .env
            grep -qx 'APP_URL=https://dev.mskba.ru' .env
            test -f compose.dev.local.yaml
            test "$(git rev-parse HEAD)" = '362549312bcff1301ab7cdeb74825b34a188b81a' || {
              echo 'Expected tested, deployed dev commit not present'; exit 1;
            }
            COMPOSE=(docker compose --env-file .env -f compose.dev.yaml -f compose.dev.local.yaml)
            "${COMPOSE[@]}" config --quiet
            STATE="$("${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:publish-v2 --check)"
            if [ "$STATE" = 'ALREADY' ]; then
              echo 'venues-map V2 already published. Nothing changed.'
              exit 0
            fi
            test "$STATE" = 'READY' || { echo 'Unexpected Page Builder baseline status'; exit 1; }
            umask 077
            BACKUP_DIR="/home/deploy/mskba-page-builder-backups/venues-map-v2-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p -m 700 "$BACKUP_DIR"
            DUMP="$BACKUP_DIR/mskba-dev-pre-venues-map-v2.dump"
            "${COMPOSE[@]}" exec -T db sh -c \
              'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc --no-owner --no-acl' > "$DUMP"
            test -s "$DUMP"
            test "$(stat -c %s "$DUMP")" -gt 1024
            "${COMPOSE[@]}" exec -T db pg_restore -l < "$DUMP" > "$BACKUP_DIR/pg_restore.list"
            test -s "$BACKUP_DIR/pg_restore.list"
            sha256sum "$DUMP" > "$BACKUP_DIR/SHA256SUMS"
            ( cd "$BACKUP_DIR" && sha256sum -c SHA256SUMS )
            echo "BACKUP VERIFIED: $BACKUP_DIR"
            "${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:publish-v2 --apply
            AFTER="$("${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:publish-v2 --check)"
            test "$AFTER" = 'ALREADY' || { echo 'Post-publication state invalid'; exit 1; }
            BODY="$(mktemp)"
            trap 'rm -f "$BODY"' EXIT
            curl -fsS --max-time 20 -H 'Accept: text/html' 'https://dev.mskba.ru/' -o "$BODY"
            grep -q 'mskba-venues-map__card-anchor' "$BODY" || { echo 'Public map popup HTML not visible'; exit 1; }
            echo 'PASS: V2 component published and custom popup mount visible on dev.'
