name: Diagnose production homepage

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-homepage.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Render homepage on production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -u
            cd /var/www/mskba
            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"

            for ATTEMPT in $(seq 1 30); do
              if $COMPOSE exec -T phpfpm php artisan about >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            $COMPOSE exec -T phpfpm php artisan tinker --execute='try { $response = \App\Presentation\Theming\ThemeResolver::page("welcome"); $response->getContent(); fwrite(STDERR, "HOME_RENDER_OK\n"); } catch (\Throwable $e) { fwrite(STDERR, "HOME_RENDER_ERROR ".get_class($e).": ".$e->getMessage()."\n"); exit(1); }'
