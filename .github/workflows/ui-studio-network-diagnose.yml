name: Diagnose UI Studio hostname routing (read only)

on:
  push:
    branches: [ops/ui-studio-995-preflight]
    paths: [.github/workflows/ui-studio-network-diagnose.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public and local HTTPS vhost responses
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            echo 'UI_STUDIO_NETWORK_CHECK=STARTED'
            echo "DNS_IPV4=$(getent ahostsv4 ui.mskba.ru | awk 'NR==1{print $1}')"
            echo "HOST_LOCAL_ADDRESSES=$(hostname -I | cut -c1-120)"
            for label in public localhost; do
              if [ "$label" = localhost ]; then
                local_resolve='--resolve ui.mskba.ru:443:127.0.0.1'
              else
                local_resolve=''
              fi
              code="$(curl $local_resolve --silent --show-error --max-time 8 --output /dev/null --write-out '%{http_code}' https://ui.mskba.ru/uikit/bridge 2>/dev/null || true)"
              echo "BRIDGE_GET_$label=$code"
              curl $local_resolve --silent --show-error --max-time 8 -I https://ui.mskba.ru/uikit/bridge 2>/dev/null                 | grep -iE '^HTTP/|^server:|^www-authenticate:|^location:|^x-powered-by:|^x-frame-options:|^via:'                 | cut -c1-180 | sed "s/^/$label:/" || true
            done
            echo 'UI_STUDIO_NETWORK_CHECK=FINISHED'
