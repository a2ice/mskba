name: Wizard step separation verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run wizard regressions
        run: php artisan test --compact tests/Feature/Event/EventCreationWizardTest.php

      - name: Check wizard JS syntax
        run: |
          node --check resources/themes/mskba_dark/js/features/event-wizard-split-game-step.js
          node --check resources/themes/mskba_dark/js/features/event-wizard-venue-first-order.js
          node --check resources/themes/mskba_dark/js/features/event-wizard-venue-first-prep.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Production build
        run: npm run build
