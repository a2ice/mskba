name: Verify Task 118

on:
  push:
    branches:
      - feature/118
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test app/Modules/Identity/Domain/Support/PlayerCharacterAppearanceOptions.php app/Modules/Identity/Presentation/Http/Requests/UpdatePlayerProfileRequest.php tests/Feature/Identity/AccountPlayerCharacterAppearanceTest.php tests/Feature/Identity/AccountPlayerCharacterStageTest.php

      - name: Player character and profile tests
        run: php artisan test tests/Feature/Identity/AccountPlayerCharacterAppearanceTest.php tests/Feature/Identity/AccountPlayerCharacterStageTest.php tests/Feature/Identity/AccountPlayerProfileTest.php

      - name: Blade cache
        run: php artisan view:cache

      - name: JavaScript syntax
        run: |
          node --check resources/themes/mskba_dark/js/features/player-character-stage.js
          node --check resources/themes/mskba_dark/js/features/player-character-three-renderer.js
          node --check resources/themes/mskba_dark/js/features/player-character-svg-renderer.js

      - name: Verify pinned Three.js runtime and GLB POC assets
        run: |
          THREE_URL='https://esm.sh/three@0.184.0?target=es2022'
          MALE_URL='https://cdn.jsdelivr.net/gh/kunalkushwaha/vsim@3f97faf85e46d2f9a122b0a8b8d3ccc0af598f91/packages/assets/library/man.glb'
          FEMALE_URL='https://cdn.jsdelivr.net/gh/kunalkushwaha/vsim@3f97faf85e46d2f9a122b0a8b8d3ccc0af598f91/packages/assets/library/human.glb'

          curl --fail --silent --show-error --location "$THREE_URL" --output /tmp/three.mjs
          test -s /tmp/three.mjs

          for url in "$MALE_URL" "$FEMALE_URL"; do
            curl --fail --silent --show-error --location "$url" --output /tmp/player.glb
            test "$(head -c 4 /tmp/player.glb)" = 'glTF'
            test "$(stat -c%s /tmp/player.glb)" -gt 100000
          done

      - name: Frontend build
        run: |
          npm ci
          npm run build
