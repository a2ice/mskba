name: Feature 101 tests

on:
  push:
    branches:
      - feature/101
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-101-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint changed PHP surface
        run: |
          php -l app/Modules/Identity/Application/Services/UserDuplicateSelfServiceProofStore.php
          php -l app/Modules/Identity/Application/Services/UserDuplicateDetector.php
          php -l app/Modules/Identity/Application/Services/UserLoginResolver.php
          php -l app/Modules/Identity/Application/UseCases/AuthHandler.php
          php -l app/Modules/Identity/Application/UseCases/ResolveUserDuplicateHandler.php
          php -l app/Modules/Telegram/Application/Services/TelegramNotificationRecipientResolver.php
          php -l app/Modules/Event/Application/Services/EventIdentityParticipationService.php

      - name: Run canonicalization regression tests
        run: |
          php artisan test \
            tests/Feature/Identity/UserCanonicalizationTest.php \
            tests/Feature/Identity/UserCanonicalLoginTest.php \
            tests/Feature/Telegram/TelegramUserNotificationDeliveryTest.php

      - name: Run full test suite
        run: composer test
