# Temporary branch-scoped workflow; remove after it creates composer.lock.
name: Mobile Auth Composer Lock (temporary)
on:
  push:
    branches:
      - feature/mobile-auth-v1-20261019
    paths:
      - composer.json
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite, gd, intl, zip
      - name: Update lock for Sanctum only
        run: composer update laravel/sanctum --with-all-dependencies --no-interaction --no-progress --prefer-dist
      - name: Commit updated lock to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build(auth): lock Laravel Sanctum dependency'
          git push origin HEAD:feature/mobile-auth-v1-20261019
