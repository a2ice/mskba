name: Prepare Filament backoffice dependencies

on:
  push:
    branches:
      - feature/filament-backoffice
    paths:
      - .github/workflows/filament-backoffice-deps.yml
      - app/**
      - bootstrap/**
      - tests/Feature/Backoffice/**
      - composer.json
      - composer.lock

permissions:
  contents: write

concurrency:
  group: filament-backoffice-deps
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/filament-backoffice

      - name: PHP 8.4 + intl
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, gd, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Resolve and lock Filament 5
        id: composer
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq '"name": "filament/filament"' composer.lock; then
            composer require 'filament/filament:^5.0' --no-scripts --no-interaction --no-progress --prefer-dist -W
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            composer install --no-interaction --no-progress --prefer-dist --no-scripts
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi
          composer validate --no-check-publish
          cp .env.example .env
          php artisan key:generate
          php artisan package:discover --ansi
          php artisan route:list --path=backoffice --except-vendor

      - name: Commit reproducible Composer lock
        if: steps.composer.outputs.updated == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git commit -m "build(backoffice): lock verified Filament 5 dependencies"
          git push origin HEAD:feature/filament-backoffice

      - name: Verify backoffice access tests
        run: php artisan test --filter BackofficeAccessTest
