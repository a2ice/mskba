name: One-time MSKBA Map Container Plate Publish

on:
  push:
    branches:
      - ops/publish-container-map-plate-20261022
    paths:
      - .github/workflows/publish-container-map-plate-20261022.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 18
    steps:
      - name: Guard against Filament drift and publish container plate after full dev DB backup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /var/www/mskba-dev-next
            grep -qx 'APP_ENV=staging' .env
            grep -qx 'APP_URL=https://dev.mskba.ru' .env
            test -f compose.dev.local.yaml
            test "$(git rev-parse HEAD)" = '52b3fe1f34e9235dab0a2722c0f9dff3d8ccada6' || {
              echo 'Unexpected deployed revision: not publishing Page Builder'; exit 1;
            }
            COMPOSE=(docker compose --env-file .env -f compose.dev.yaml -f compose.dev.local.yaml)
            "${COMPOSE[@]}" config --quiet
            CHECK="$("${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:container-plate --check)"
            if [ "$CHECK" = 'ALREADY' ]; then
              echo 'Constrained map plate is already published; no changes needed.'
              exit 0
            fi
            test "$CHECK" = 'READY' || { echo 'Filament contents differ from preserved baseline'; exit 1; }
            umask 077
            BACKUP_DIR="/home/deploy/mskba-page-builder-backups/map-container-plate-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p -m 700 "$BACKUP_DIR"
            DUMP="$BACKUP_DIR/dev-before-map-container-plate.dump"
            "${COMPOSE[@]}" exec -T db sh -c \
              'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc --no-owner --no-acl' > "$DUMP"
            test -s "$DUMP"
            test "$(stat -c %s "$DUMP")" -gt 1024
            "${COMPOSE[@]}" exec -T db pg_restore -l < "$DUMP" > "$BACKUP_DIR/pg_restore.list"
            test -s "$BACKUP_DIR/pg_restore.list"
            sha256sum "$DUMP" > "$BACKUP_DIR/SHA256SUMS"
            (cd "$BACKUP_DIR" && sha256sum -c SHA256SUMS)
            echo "BACKUP VERIFIED: $BACKUP_DIR"
            APPLY="$("${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:container-plate --apply)"
            test "$APPLY" = 'PUBLISHED' || { echo 'Page Builder publication did not complete'; exit 1; }
            AFTER="$("${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan mskba:venues-map:container-plate --check)"
            test "$AFTER" = 'ALREADY' || { echo 'Unexpected post-publication state'; exit 1; }
            PAGE="$(mktemp)"
            trap 'rm -f "$PAGE"' EXIT
            curl -fsS --max-time 20 -H 'Accept: text/html' https://dev.mskba.ru/ -o "$PAGE"
            grep -q 'mskba-venues-map-section__container' "$PAGE" || { echo 'New constrained map markup is not served'; exit 1; }
            grep -q 'mskba-venues-map__canvas' "$PAGE" || { echo 'Interactive map mount is not served'; exit 1; }
            echo 'PASS: dev homepage now serves map in rounded .container-width plate; other homepage scenes untouched.'
