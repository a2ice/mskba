name: UI Studio Nginx patch real-vhost dry run

on:
  push:
    branches: [ops/ui-studio-995-preflight]
    paths:
      - '.github/workflows/ui-studio-nginx-dryrun.yml'

permissions:
  contents: read

concurrency:
  group: mskba-ui-preview-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect real nginx vhost with shipped patch (no writes)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            exec 9>/var/www/mskba-ui-runtime/publish.lock
            flock -w 60 9
            test "$(git -C /var/www/mskba-ui rev-parse HEAD)" = 11eed30f170a2819c05942281d42f7efabe32eee
            python3 /var/www/mskba-ui/ops/ui-studio/enable-nginx-bridge.py
            echo 'STUDIO_NGINX_PATCH_DRY_RUN=PASS'
