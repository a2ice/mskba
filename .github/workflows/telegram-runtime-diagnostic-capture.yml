name: Telegram runtime diagnostic capture

on:
  push:
    branches:
      - diagnostic/telegram-webhook-runtime
    paths:
      - ".github/workflows/telegram-runtime-diagnostic-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture production Telegram runtime
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key

          ssh -i ~/.ssh/id_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            deploy@"$SERVER_HOST" 'bash -s' > telegram-runtime-output.txt 2>&1 <<'REMOTE'
          set +e
          cd /var/www/mskba
          COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"

          echo "=== captured_at ==="
          date -Is
          echo "=== deployed_revision ==="
          git rev-parse HEAD

          echo "=== telegram_non_secret_env ==="
          grep -E '^(TELEGRAM_UPDATES_TRANSPORT|TELEGRAM_QUEUE_CONNECTION|TELEGRAM_QUEUE_INBOUND|TELEGRAM_QUEUE_BACKGROUND|TELEGRAM_FORCE_IPV4)=' .env

          echo "=== compose_services ==="
          $COMPOSE ps

          echo "=== nginx_webhook_hits_last_60m ==="
          $COMPOSE logs --since=60m nginx 2>&1 | grep -F '/api/integrations/telegram/webhook' | tail -n 200

          echo "=== inbound_worker_last_60m ==="
          $COMPOSE logs --since=60m telegram-inbound-queue 2>&1 | tail -n 200

          echo "=== poller_service_status_and_logs ==="
          $COMPOSE --profile polling ps telegram
          $COMPOSE --profile polling logs --since=60m telegram 2>&1 | tail -n 120

          echo "=== laravel_telegram_lines_last_1500 ==="
          tail -n 1500 storage/logs/laravel.log 2>/dev/null | grep -Ei 'telegram|ProcessTelegramCallbackJob|HandleEventParticipationCallback|callback_query|event:24|api\.telegram\.org|Connection timed out|cURL error' | tail -n 300

          echo "=== failed_jobs ==="
          $COMPOSE exec -T phpfpm php artisan queue:failed

          echo "=== redis_inbound_queue ==="
          $COMPOSE exec -T redis sh -lc 'for key in queues:telegram-inbound queues:telegram-inbound:reserved queues:telegram-inbound:delayed; do echo -n "$key type="; redis-cli TYPE "$key"; echo -n " llen="; redis-cli LLEN "$key" 2>/dev/null; echo -n " zcard="; redis-cli ZCARD "$key" 2>/dev/null; done'

          echo "=== host_outbound ==="
          for URL in https://api.telegram.org https://github.com; do
            CODE="$(timeout 12 curl -4 -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$URL" 2>/dev/null)"
            RC=$?
            echo "HOST $URL => rc=$RC code=${CODE:-FAIL}"
          done
          for IP in 149.154.166.110 149.154.167.220 91.108.56.130 91.108.4.1 1.1.1.1; do
            timeout 6 bash -lc "</dev/tcp/$IP/443" >/dev/null 2>&1
            echo "HOST TCP $IP:443 => rc=$?"
          done

          echo "=== webhook_info_with_timeout ==="
          timeout 15 $COMPOSE exec -T phpfpm php artisan tinker --execute='$r=app(\App\Modules\Telegram\Infrastructure\Services\TelegramBotApiClient::class)->call("getWebhookInfo"); $i=$r["result"]??[]; echo json_encode(["url"=>$i["url"]??null,"pending_update_count"=>$i["pending_update_count"]??null,"last_error_date"=>$i["last_error_date"]??null,"last_error_message"=>$i["last_error_message"]??null], JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;'
          echo "webhook_info_rc=$?"
          REMOTE

      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-runtime-output.txt
          git commit -m "chore: refresh Telegram production runtime" || exit 0
          git push

# rerun after PR 234 merge
