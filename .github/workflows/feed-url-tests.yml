name: Feed URL tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate route cache
        run: |
          php artisan route:clear
          php artisan route:cache
          php artisan route:clear

      - name: Run feed migration tests
        run: |
          php artisan test \
            tests/Feature/Content/FeedUrlTest.php \
            tests/Feature/Content/ContentWorkflowTest.php
