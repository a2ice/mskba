name: Normalize photographed ball frame alignment (one-time)

on:
  push:
    branches:
      - fix/hero-ball-scroll-sync-frame-alignment-20261017
    paths:
      - .github/workflows/normalize-ball-sprite-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.2.1
      - name: Center the real photographed frames without changing their content
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          src=Path('public/images/ball-16.png')
          dst=Path('public/images/ball-16.webp')
          with Image.open(src) as file:
              original=file.convert('RGBA')
          assert original.size == (1254,1254), original.size
          out=Image.new('RGBA',(1024,1024),(0,0,0,0))
          metrics=[]
          for index in range(16):
              col=index%4
              row=index//4
              x0=round(original.width*col/4)
              x1=round(original.width*(col+1)/4)
              y0=round(original.height*row/4)
              y1=round(original.height*(row+1)/4)
              tile=original.crop((x0,y0,x1,y1))
              mask=tile.getchannel('A').point(lambda a:255 if a>=32 else 0)
              bbox=mask.getbbox()
              if bbox is None:
                  raise SystemExit(f'Empty photographed frame {index}')
              # Uniform scale for every photograph. Do not dynamically zoom,
              # reshape, rotate, retouch or alter image features per frame.
              image=tile.resize((226,226),Image.Resampling.LANCZOS)
              sx=226/tile.width
              sy=226/tile.height
              offset_x=round(128-(bbox[0]+bbox[2])/2*sx)
              offset_y=round(128-(bbox[1]+bbox[3])/2*sy)
              canvas=Image.new('RGBA',(256,256),(0,0,0,0))
              canvas.alpha_composite(image,(offset_x,offset_y))
              framebbox=canvas.getchannel('A').point(lambda a:255 if a>=32 else 0).getbbox()
              if framebbox is None:
                  raise SystemExit(f'Frame {index} disappeared')
              center=((framebbox[0]+framebbox[2])/2,(framebbox[1]+framebbox[3])/2)
              error=max(abs(center[0]-128),abs(center[1]-128))
              if error>2.0:
                  raise SystemExit(f'Frame {index} not centered: {center}')
              if 0 in framebbox[:2] or 256 in framebbox[2:]:
                  raise SystemExit(f'Frame {index} touches atlas tile edge after centering: {framebbox}')
              out.alpha_composite(canvas,(col*256,row*256))
              metrics.append((index,bbox,framebbox,center))
          out.save(dst,'WEBP',quality=93,method=6,exact=True,alpha_quality=100)
          with Image.open(dst) as encoded:
              assert encoded.size==(1024,1024)
              assert encoded.mode=='RGBA'
          print('FRAME_ALIGNMENT',metrics)
          print('OUTPUT',{'bytes':dst.stat().st_size,'sha256':hashlib.sha256(dst.read_bytes()).hexdigest(),
                          'png_bytes':src.stat().st_size})
          PY
      - name: Commit only the centered WebP to feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/hero-ball-scroll-sync-frame-alignment-20261017"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/ball-16.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(hero): align photographed ball silhouettes across all frames"
            git push origin HEAD:fix/hero-ball-scroll-sync-frame-alignment-20261017
          fi
