name: Export published map markup to reconcile Page Builder (read only)
on:
  push:
    branches: [ops/publish-container-map-plate-20261022]
    paths: [.github/workflows/export-live-map-source-20261022.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 8
    steps:
      - name: Export only public map HTML/CSS, not keys or private database fields
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            cd /var/www/mskba-dev-next
            grep -qx 'APP_ENV=staging' .env
            COMPOSE=(docker compose --env-file .env -f compose.dev.yaml -f compose.dev.local.yaml)
            "${COMPOSE[@]}" run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); $c=\App\Modules\Content\Domain\Models\PageBuilderComponent::query()->where("slug","venues-map")->firstOrFail(); if($c->draft_html!==$c->published_html || $c->draft_css!==$c->published_css) {fwrite(STDERR,"Draft/publication mismatch; abort export\n");exit(1);} echo "MSKBA_MAP_EXPORT:".json_encode(["html"=>(string)$c->published_html,"css"=>(string)$c->published_css],JSON_UNESCAPED_UNICODE|JSON_INVALID_UTF8_SUBSTITUTE|JSON_THROW_ON_ERROR)."\n";'
