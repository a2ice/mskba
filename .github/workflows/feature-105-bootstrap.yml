name: Feature 105 apply and verify

on:
  push:
    branches:
      - feature/105

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          parts = sorted(Path('.github/feature105-payload').glob('part*'))
          if not parts:
              raise SystemExit('No payload parts found')

          chunks = []
          for part in parts:
              raw = part.read_text(encoding='utf-8', errors='ignore')
              cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              print(f'{part}: raw={len(raw)} base64={len(cleaned)}')
              chunks.append(cleaned)

          encoded = ''.join(chunks).rstrip('=')
          encoded += '=' * (-len(encoded) % 4)
          print(f'combined base64 size: {len(encoded)}')

          try:
              decoded = base64.b64decode(encoded, validate=False)
          except Exception as exc:
              raise SystemExit(f'Base64 decode failed: {exc}') from exc

          archive = Path('/tmp/feature105.tgz')
          archive.write_bytes(decoded)
          print(f'decoded archive size: {len(decoded)} bytes')
          PY
          gzip -t /tmp/feature105.tgz
          tar -tzf /tmp/feature105.tgz >/dev/null
          tar -xzf /tmp/feature105.tgz
          rm -rf .github/feature105-payload
          rm -f .github/workflows/feature-105-bootstrap.yml

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, sqlite3, mbstring, intl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel test environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format changed PHP files
        shell: bash
        run: |
          vendor/bin/pint \
            app/Support/Basketball/BalancedTeamFormationEngine.php \
            app/Modules/Event/Application/Services/GameAdmissionService.php \
            app/Modules/Event/Application/Services/StandaloneGameFormationService.php \
            app/Modules/Event/Application/UseCases/CreateEventHandler.php \
            app/Modules/Event/Domain/Models/Game.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameAdmissionController.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameCandidateSearchController.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameFormationController.php \
            app/Modules/Event/Presentation/Http/Requests/CreateEventRequest.php \
            app/Modules/Tournament/Application/Services/TournamentFormationService.php \
            database/migrations/2026_08_22_010000_add_game_application_setting.php \
            tests/Feature/Event/StandaloneGameRecruitmentWorkflowTest.php

      - name: Run PHP test suite
        run: php artisan test --compact

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes to commit"; exit 1; }
          git commit -m "feat(games): complete unified participant formation"
          git push origin HEAD:feature/105
