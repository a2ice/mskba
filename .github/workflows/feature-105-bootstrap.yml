name: Feature 105 materialize and verify

on:
  push:
    branches:
      - feature/105
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/105
          fetch-depth: 0

      - name: Materialize real implementation files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          import gzip
          import re
          import tarfile

          payload_dir = Path('.github/feature105-payload')
          parts = sorted(payload_dir.glob('part*'))
          if not parts:
              raise SystemExit('No payload parts found')

          chunks = []
          for part in parts:
              raw = part.read_text(encoding='utf-8', errors='ignore')
              cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              print(f'{part}: raw={len(raw)} cleaned={len(cleaned)}')
              chunks.append(cleaned)

          def decode_text(text: str) -> bytes:
              text = text.rstrip('=')
              text += '=' * (-len(text) % 4)
              return base64.b64decode(text, validate=False)

          def valid_archive(data: bytes):
              try:
                  unpacked = gzip.decompress(data)
                  with tarfile.open(fileobj=BytesIO(data), mode='r:gz') as archive:
                      members = archive.getmembers()
                      if not members:
                          return None
                  return members
              except Exception:
                  return None

          combined = ''.join(chunks)
          selected_data = None
          selected_members = None

          # The payload should be 54,000 base64 chars. part00 contains one
          # accidental extra base64 character (6,001 instead of 6,000).
          # First try the most likely boundary cases, then locate it exactly.
          candidate_texts = []
          if len(chunks[0]) == 6001:
              candidate_texts.append(('drop-last-part00-char', chunks[0][:-1] + ''.join(chunks[1:])))
              candidate_texts.append(('drop-first-part00-char', chunks[0][1:] + ''.join(chunks[1:])))

          candidate_texts.append(('as-is', combined))

          for name, text in candidate_texts:
              try:
                  data = decode_text(text)
              except Exception as exc:
                  print(f'{name}: base64 decode failed: {exc}')
                  continue
              members = valid_archive(data)
              if members is not None:
                  print(f'selected {name}: {len(data)} bytes, {len(members)} members')
                  selected_data = data
                  selected_members = members
                  break
              print(f'{name}: not a valid tar.gz')

          if selected_data is None and len(chunks[0]) == 6001:
              suffix = ''.join(chunks[1:])
              for index in range(len(chunks[0])):
                  text = chunks[0][:index] + chunks[0][index + 1:] + suffix
                  try:
                      data = decode_text(text)
                  except Exception:
                      continue
                  members = valid_archive(data)
                  if members is not None:
                      print(f'found extra base64 character at part00 index {index}: {chunks[0][index]!r}')
                      selected_data = data
                      selected_members = members
                      break

          if selected_data is None:
              raise SystemExit('Could not reconstruct a valid feature 105 tar.gz payload')

          root = Path.cwd().resolve()
          with tarfile.open(fileobj=BytesIO(selected_data), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if root != target and root not in target.parents:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              archive.extractall(root)

          print('Materialized files:')
          for member in selected_members:
              if member.isfile():
                  print(member.name)
          PY

          rm -rf .github/feature105-payload
          rm -f .github/workflows/feature-105-bootstrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes materialized"; exit 1; }
          git commit -m "feat(games): materialize unified participant formation"
          git push origin HEAD:feature/105

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, sqlite3, mbstring, intl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel test environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format feature PHP files
        shell: bash
        run: |
          vendor/bin/pint \
            app/Support/Basketball/BalancedTeamFormationEngine.php \
            app/Modules/Event/Application/Services/GameAdmissionService.php \
            app/Modules/Event/Application/Services/StandaloneGameFormationService.php \
            app/Modules/Event/Application/UseCases/CreateEventHandler.php \
            app/Modules/Event/Domain/Models/Game.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameAdmissionController.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameCandidateSearchController.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameFormationController.php \
            app/Modules/Event/Presentation/Http/Requests/CreateEventRequest.php \
            app/Modules/Tournament/Application/Services/TournamentFormationService.php \
            database/migrations/2026_08_22_010000_add_game_application_setting.php \
            tests/Feature/Event/StandaloneGameRecruitmentWorkflowTest.php

      - name: Run PHP test suite
        run: php artisan test --compact

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Commit formatter changes if needed
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(games): format feature 105 implementation"
            git push origin HEAD:feature/105
          fi
