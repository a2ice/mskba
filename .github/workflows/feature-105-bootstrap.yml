name: Feature 105 materialize and verify

on:
  push:
    branches:
      - feature/105

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize real implementation files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          import re
          import tarfile

          payload_dir = Path('.github/feature105-payload')
          parts = sorted(payload_dir.glob('part*'))
          if not parts:
              raise SystemExit('No payload parts found')

          chunks = []
          for part in parts:
              raw = part.read_text(encoding='utf-8', errors='ignore')
              cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              print(f'{part}: raw={len(raw)} cleaned={len(cleaned)}')
              chunks.append(cleaned)

          def decode_normalized(text: str) -> bytes:
              text = text.rstrip('=')
              text += '=' * (-len(text) % 4)
              return base64.b64decode(text, validate=False)

          candidates = []

          try:
              candidates.append(('single-stream', decode_normalized(''.join(chunks))))
          except Exception as exc:
              print(f'single-stream decode failed: {exc}')

          try:
              joined = ''.join(chunk.rstrip('=') for chunk in chunks)
              candidates.append(('joined-without-inner-padding', decode_normalized(joined)))
          except Exception as exc:
              print(f'joined-without-inner-padding decode failed: {exc}')

          try:
              candidates.append((
                  'per-part',
                  b''.join(decode_normalized(chunk) for chunk in chunks),
              ))
          except Exception as exc:
              print(f'per-part decode failed: {exc}')

          selected = None
          members = None
          for name, data in candidates:
              print(f'trying {name}: {len(data)} decoded bytes')
              try:
                  with tarfile.open(fileobj=BytesIO(data), mode='r:gz') as archive:
                      candidate_members = archive.getmembers()
                      if not candidate_members:
                          raise ValueError('archive is empty')
                  selected = (name, data)
                  members = candidate_members
                  print(f'selected {name}: {len(candidate_members)} archive members')
                  break
              except Exception as exc:
                  print(f'{name} is not a valid tar.gz payload: {exc}')

          if selected is None:
              raise SystemExit('Payload cannot be decoded into a valid tar.gz archive')

          _, data = selected
          root = Path.cwd().resolve()
          with tarfile.open(fileobj=BytesIO(data), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if root != target and root not in target.parents:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              archive.extractall(root)

          print('Materialized files:')
          for member in members:
              if member.isfile():
                  print(member.name)
          PY

          rm -rf .github/feature105-payload
          rm -f .github/workflows/feature-105-bootstrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes materialized"; exit 1; }
          git commit -m "feat(games): materialize unified participant formation"
          git push origin HEAD:feature/105

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, sqlite3, mbstring, intl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel test environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format feature PHP files
        shell: bash
        run: |
          vendor/bin/pint \
            app/Support/Basketball/BalancedTeamFormationEngine.php \
            app/Modules/Event/Application/Services/GameAdmissionService.php \
            app/Modules/Event/Application/Services/StandaloneGameFormationService.php \
            app/Modules/Event/Application/UseCases/CreateEventHandler.php \
            app/Modules/Event/Domain/Models/Game.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameAdmissionController.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameCandidateSearchController.php \
            app/Modules/Event/Presentation/Http/Controllers/StandaloneGameFormationController.php \
            app/Modules/Event/Presentation/Http/Requests/CreateEventRequest.php \
            app/Modules/Tournament/Application/Services/TournamentFormationService.php \
            database/migrations/2026_08_22_010000_add_game_application_setting.php \
            tests/Feature/Event/StandaloneGameRecruitmentWorkflowTest.php

      - name: Run PHP test suite
        run: php artisan test --compact

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Commit formatter changes if needed
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(games): format feature 105 implementation"
            git push origin HEAD:feature/105
          fi
