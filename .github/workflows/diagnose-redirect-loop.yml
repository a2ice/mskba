name: Diagnose public redirect loop

on:
  push:
    branches:
      - diag/redirect-loop
    paths:
      - ".github/workflows/diagnose-redirect-loop.yml"

jobs:
  public-http:
    runs-on: ubuntu-latest
    steps:
      - name: Check public redirect responses
        shell: bash
        run: |
          set +e
          for URL in https://mskba.ru/ https://www.mskba.ru/; do
            echo "===== $URL (no follow) ====="
            curl -sS -o /dev/null -D - --max-redirs 0 "$URL"
            echo
            echo "===== $URL (follow up to 5) ====="
            curl -sS -o /dev/null -D - -L --max-redirs 5 "$URL"
            echo
          done

  server-http:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production proxy and responses
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== host nginx routing ====="
            grep -RniE 'server_name|proxy_pass|return 30[1278]|X-Forwarded|listen .*443|listen .*80' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true

            echo "===== direct docker nginx: bare host ====="
            curl -sS -o /dev/null -D - --max-redirs 0 -H 'Host: mskba.ru' http://127.0.0.1:8000/ || true

            echo "===== direct docker nginx: www host ====="
            curl -sS -o /dev/null -D - --max-redirs 0 -H 'Host: www.mskba.ru' http://127.0.0.1:8000/ || true

            echo "===== public bare host from VDS ====="
            curl -k -sS -o /dev/null -D - --max-redirs 0 https://mskba.ru/ || true

            echo "===== public www host from VDS ====="
            curl -k -sS -o /dev/null -D - --max-redirs 0 https://www.mskba.ru/ || true
