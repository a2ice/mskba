name: Diagnose public redirect loop

on:
  push:
    branches:
      - diag/redirect-loop
    paths:
      - ".github/workflows/diagnose-redirect-loop.yml"

jobs:
  public-http:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical host policy externally
        shell: bash
        run: |
          set -euo pipefail

          check() {
            local url="$1"
            local expected_status="$2"
            local expected_location="${3:-}"

            local headers
            headers="$(curl -sS -o /dev/null -D - --max-redirs 0 "$url")"
            local status
            status="$(printf '%s\n' "$headers" | awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}')"
            local location
            location="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}')"

            echo "$url -> $status ${location:+Location: $location}"

            test "$status" = "$expected_status"
            if [ -n "$expected_location" ]; then
              test "$location" = "$expected_location"
            fi
          }

          check "http://mskba.ru/" "301" "https://mskba.ru/"
          check "http://www.mskba.ru/" "301" "https://mskba.ru/"
          check "https://www.mskba.ru/" "301" "https://mskba.ru/"
          check "https://mskba.ru/" "200"

          final_url="$(curl -sS -o /dev/null -w '%{url_effective}' -L --max-redirs 3 https://www.mskba.ru/)"
          test "$final_url" = "https://mskba.ru/"
