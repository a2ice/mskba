name: Diagnose public redirect loop

on:
  push:
    branches:
      - diag/redirect-loop
    paths:
      - ".github/workflows/diagnose-redirect-loop.yml"

jobs:
  inspect-host:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production host nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e

            echo "===== file metadata ====="
            ls -l /etc/nginx/sites-enabled/mskba-prod /etc/nginx/sites-available/mskba-prod 2>/dev/null || true

            echo "===== current mskba-prod ====="
            cat /etc/nginx/sites-enabled/mskba-prod 2>/dev/null || true

            echo "===== passwordless sudo ====="
            if sudo -n true 2>/dev/null; then
              echo "SUDO_N_NOPASSWD=yes"
            else
              echo "SUDO_N_NOPASSWD=no"
            fi

            echo "===== nginx config test availability ====="
            nginx -t 2>&1 || true
            sudo -n nginx -t 2>&1 || true
