name: MSKBA data merge read-only server inventory

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/data-merge-remote-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mskba-data-merge-readonly-inventory
  cancel-in-progress: false

jobs:
  production:
    name: Read-only production aggregates
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production PostgreSQL without changing data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/mskba
            test -f .env
            echo "PRODUCTION_INVENTORY"
            printf 'git_commit='
            git rev-parse --short HEAD
            if docker volume ls --format '{{.Name}}' | grep -qx mskba_postgres_data; then
              echo 'historical_postgres_volume=present'
            else
              echo 'historical_postgres_volume=not_found'
            fi
            docker compose -f compose.yaml -f compose.prod.yaml exec -T db sh -s <<'DB_SCRIPT'
            set -eu
            export PGPASSWORD="$POSTGRES_PASSWORD"
            export PGOPTIONS="-c default_transaction_read_only=on"
            sql() { psql -X -A -t -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"; }
            echo 'AGGREGATE_BEGIN prod'
            printf 'postgres_version=%s\n' "$(sql "SHOW server_version")"
            printf 'public_tables=%s\n' "$(sql "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public'")"
            printf 'schema_sha256=%s\n' "$(sql "SELECT md5(COALESCE(string_agg(table_name || ':' || column_name || ':' || udt_name, ',' ORDER BY table_name, ordinal_position), '')) FROM information_schema.columns WHERE table_schema='public'")"
            for name in migrations users profiles player_profiles contacts actors contracts contract_memberships contract_relations contract_permissions teams team_invitations team_join_requests events event_participants games game_sides game_roster_entries game_player_statistics tournaments tournament_admissions tournament_entries tournament_entry_members tournament_matches venues venue_courts venue_bookings venue_ownerships media site_media page_builder_pages content_items; do
              case "$name" in *[!a-z0-9_]*|'') exit 5;; esac
              exists="$(sql "SELECT to_regclass('public.$name') IS NOT NULL")"
              if [ "$exists" = t ]; then
                total="$(sql "SELECT COUNT(*) FROM public.$name")"
                printf 'rows.%s=%s\n' "$name" "$total"
              else
                printf 'rows.%s=ABSENT\n' "$name"
              fi
            done
            echo 'recent_migrations:'
            if [ "$(sql "SELECT to_regclass('public.migrations') IS NOT NULL")" = t ]; then
              sql "SELECT migration FROM migrations ORDER BY migration DESC LIMIT 5"
            fi
            echo 'AGGREGATE_END prod'
            DB_SCRIPT

  development:
    name: Read-only dev aggregates
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Inspect dev PostgreSQL without changing data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/mskba-dev-next
            test -f .env
            test -f compose.dev.local.yaml
            echo 'DEVELOPMENT_INVENTORY'
            printf 'git_commit='
            git rev-parse --short HEAD
            docker compose --env-file .env -f compose.dev.yaml -f compose.dev.local.yaml exec -T db sh -s <<'DB_SCRIPT'
            set -eu
            export PGPASSWORD="$POSTGRES_PASSWORD"
            export PGOPTIONS="-c default_transaction_read_only=on"
            sql() { psql -X -A -t -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"; }
            echo 'AGGREGATE_BEGIN dev'
            printf 'postgres_version=%s\n' "$(sql "SHOW server_version")"
            printf 'public_tables=%s\n' "$(sql "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public'")"
            printf 'schema_sha256=%s\n' "$(sql "SELECT md5(COALESCE(string_agg(table_name || ':' || column_name || ':' || udt_name, ',' ORDER BY table_name, ordinal_position), '')) FROM information_schema.columns WHERE table_schema='public'")"
            for name in migrations users profiles player_profiles contacts actors contracts contract_memberships contract_relations contract_permissions teams team_invitations team_join_requests events event_participants games game_sides game_roster_entries game_player_statistics tournaments tournament_admissions tournament_entries tournament_entry_members tournament_matches venues venue_courts venue_bookings venue_ownerships media site_media page_builder_pages content_items; do
              case "$name" in *[!a-z0-9_]*|'') exit 5;; esac
              exists="$(sql "SELECT to_regclass('public.$name') IS NOT NULL")"
              if [ "$exists" = t ]; then
                total="$(sql "SELECT COUNT(*) FROM public.$name")"
                printf 'rows.%s=%s\n' "$name" "$total"
              else
                printf 'rows.%s=ABSENT\n' "$name"
              fi
            done
            echo 'recent_migrations:'
            if [ "$(sql "SELECT to_regclass('public.migrations') IS NOT NULL")" = t ]; then
              sql "SELECT migration FROM migrations ORDER BY migration DESC LIMIT 5"
            fi
            echo 'AGGREGATE_END dev'
            DB_SCRIPT
