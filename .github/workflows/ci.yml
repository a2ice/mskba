name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate production compose
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Run PHP tests
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build


  diagnose-sitemap:
    if: github.head_ref == 'fix/280-runtime-diagnostic'
    runs-on: ubuntu-latest

    steps:
      - name: Diagnose sitemap on production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -u
            cd /var/www/mskba
            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"

            $COMPOSE exec -T phpfpm php artisan tinker --execute='try { $controller = app(\App\Modules\Content\Presentation\Http\Controllers\SeoSitemapController::class); $response = $controller(); fwrite(STDERR, "SITEMAP_CONTROLLER_OK status=".$response->getStatusCode()." bytes=".strlen($response->getContent())."\n"); } catch (\Throwable $e) { $root = $e; while ($root->getPrevious()) { $root = $root->getPrevious(); } fwrite(STDERR, "SITEMAP_CONTROLLER_ERROR ".get_class($root).": ".$root->getMessage()." @ ".$root->getFile().":".$root->getLine()."\n"); exit(1); }'
