name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      diagnose_ssh:
        description: "Read-only SSH daemon diagnostics"
        type: boolean
        required: false
        default: false
      deploy_dev_now:
        description: "Supervised deploy to staging after backups/marker are verified"
        type: boolean
        required: false
        default: false
      preflight_dev:
        description: "Run read-only production-safe dev deploy preflight"
        type: boolean
        required: false
        default: false
      test_dev_ssh:
        description: "Run read-only development SSH connectivity check"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, gd
          coverage: none
          ini-values: short_open_tag=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate production compose
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Validate isolated dev compose
        run: DB_PASSWORD=ci-compose-validation-only docker compose --env-file .env.dev.example -f compose.dev.yaml config --quiet

      - name: Run PHP tests
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

  deploy_dev:
    needs: test
    if: >-
      ${{ github.ref == 'refs/heads/dev' && ((github.event_name == 'push' && vars.ENABLE_DEV_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_dev_now)) }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy verified commit via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VERIFIED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          envs: VERIFIED_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/mskba-dev-next
            test -f .env || { echo 'Dev .env missing'; exit 1; }
            grep -qx 'APP_THEME=mskba_app' .env
            grep -qx 'APP_URL=https://dev.mskba.ru' .env
            test -f compose.dev.local.yaml || { echo 'Verified local compose override missing'; exit 1; }
            test "$(stat -c '%a' .env)" = '640' || { echo 'Dev .env must be mode 640'; exit 1; }
            # Explicit fail-closed checks; never print secret values.
            grep -qx 'APP_ENV=staging' .env
            grep -qx 'APP_DEBUG=false' .env
            # Staging may use real provider credentials for supervised integration tests.
            # A shared Telegram bot cannot have two independent webhook URLs:
            # changing its webhook here would divert production updates.
            grep -Eq '^MAIL_MAILER=(log|smtp)$' .env
            grep -qx 'TELEGRAM_UPDATES_TRANSPORT=disabled' .env
            # Never auto-configure a Telegram webhook or start consumers from deploy.
            test -f .dev-bootstrap-complete || { echo 'Dev bootstrap marker missing'; exit 1; }
            case "$VERIFIED_SHA" in *[!0-9a-f]*|'') exit 1;; esac
            test "${#VERIFIED_SHA}" -eq 40
            # Verify essential local resources before any tracked file is replaced.
            test "$(stat -c '%U:%G:%a' .env)" = 'deploy:www-data:640'
            docker image inspect mskbanew-phpfpm:latest >/dev/null
            COMPOSE='docker compose --env-file .env -f compose.dev.yaml -f compose.dev.local.yaml'
            $COMPOSE config --quiet
            test -f public/build/manifest.json
            test -w storage && test -w bootstrap/cache
            git fetch origin dev
            test "$(git rev-parse origin/dev)" = "$VERIFIED_SHA" || {
              echo 'Verified commit no longer matches dev HEAD; skip older deployment'; exit 0;
            }
            test -z "$(git status --porcelain --untracked-files=no)" || {
              echo 'Server has tracked modifications; manual review required'; exit 1;
            }
            # No git clean: preserve server-only .env, storage and compose override.
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            if ! git diff --quiet "$PREVIOUS_SHA" "$VERIFIED_SHA" -- composer.json composer.lock; then
              echo 'Composer dependency changes require a separate prepared release; refusing in-place install'
              exit 1
            fi
            git reset --hard "$VERIFIED_SHA"
            $COMPOSE config --quiet
            test -f public/build/manifest.json
            # This staging VDS has ~2 GiB RAM: never build PHP on the server.
            $COMPOSE up -d --no-build db redis
            test -f vendor/autoload.php || { echo 'Composer dependencies missing; stop before restarting'; exit 1; }
            $COMPOSE run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan migrate --force --no-interaction
            $COMPOSE run --rm -T --no-deps --user "$(id -u):$(id -g)" phpfpm php artisan optimize:clear
            $COMPOSE up -d --no-build --force-recreate phpfpm reverb nginx
            curl --fail --silent --show-error --max-time 20 -H 'Host: dev.mskba.ru' http://127.0.0.1:8001/ > /dev/null
            echo 'Dev deployment completed; production untouched'

  ssh_smoke_dev:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_dev_ssh && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 5
    steps:
      - name: Read-only SSH test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -eu
            test "$(id -un)" = deploy
            echo "Authenticated user: $(whoami)"
            hostname
            test -d /var/www/mskba-dev-next/.git
            test -r /var/www/mskba-dev-next/compose.dev.yaml
            echo 'SSH READ-ONLY TEST PASSED'

  preflight_dev:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_dev && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 5
    steps:
      - name: Read-only server deployment readiness
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 90s
          script: |
            set -eu
            cd /var/www/mskba-dev-next
            test "$(id -un)" = deploy
            test -f .env
            test -f compose.dev.local.yaml
            test "$(stat -c '%U:%G:%a' .env)" = 'deploy:www-data:640'
            grep -qx 'APP_ENV=staging' .env
            grep -qx 'APP_DEBUG=false' .env
            grep -qx 'APP_THEME=mskba_app' .env
            grep -qx 'APP_URL=https://dev.mskba.ru' .env
            grep -Eq '^MAIL_MAILER=(log|smtp)$' .env
            grep -qx 'TELEGRAM_UPDATES_TRANSPORT=disabled' .env
            test -z "$(git status --porcelain --untracked-files=no)"
            docker compose --env-file .env -f compose.dev.yaml -f compose.dev.local.yaml config --quiet
            docker image inspect mskbanew-phpfpm:latest --format '{{.Id}}' >/dev/null
            test -f public/build/manifest.json
            test -w storage && test -w bootstrap/cache
            curl -fsS -o /dev/null --max-time 10 https://dev.mskba.ru/
            curl -fsS -o /dev/null --max-time 10 https://mskba.ru/
            echo 'READ-ONLY DEV PREFLIGHT PASSED'

  diagnose_ssh:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_ssh && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 5
    steps:
      - name: Read-only SSH daemon and network diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 90s
          script: |
            set -u
            echo '=== SSH DAEMON ==='
            systemctl is-active ssh || true
            systemctl show ssh -p ActiveState -p SubState -p MainPID --no-pager || true
            echo '=== CONNECTIONS ==='
            ss -tan '( sport = :22 )' | awk 'NR==1 || NR<=25 {print}' || true
            echo '=== TCP STATES COUNT ==='
            ss -tan '( sport = :22 )' | awk 'NR>1 {count[$1]++} END {for (state in count) print state, count[state]}' || true
            echo '=== EFFECTIVE SSH LIMITS ==='
            /usr/sbin/sshd -T 2>/dev/null | grep -Ei '^(maxstartups|maxsessions|persourcemaxstartups|logingracetime|usepam) ' || true
            echo '=== MEMORY AND LOAD ==='
            free -h; uptime; df -h /
            echo '=== SSH LOGS (REDACTED) ==='
            journalctl -u ssh --since '2 hours ago' --no-pager -n 80 2>/dev/null | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[IP]/g; s/(user |for )[^ ]+/(user )REDACTED/g' | tail -60 || true
            echo 'READ-ONLY SSH DIAGNOSTICS COMPLETE'
