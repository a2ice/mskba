name: Task 122 verification

on:
  push:
    branches:
      - feature/122
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Player Character feature tests
        run: |
          php artisan test tests/Feature/Identity/AccountPlayerCharacterStageTest.php
          php artisan test tests/Feature/Identity/AccountPlayerCharacterAppearanceTest.php

      - name: Compile Blade views
        run: |
          php artisan view:cache
          php artisan view:clear

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: JavaScript syntax
        run: |
          node --check resources/themes/mskba_dark/js/features/player-character-stage.js
          node --check resources/themes/mskba_dark/js/features/player-character-three-renderer.js
          node --check resources/themes/mskba_dark/js/features/player-character-procedural-male.js

      - name: Production frontend build
        run: npm run build

      - name: Install visual verification dependencies
        run: |
          npm install --no-save --package-lock=false three@0.184.0 playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Geometry contract checks
        run: |
          cat > /tmp/task122-geometry.mjs <<'NODE'
          import * as THREE from 'three';
          import { pathToFileURL } from 'node:url';
          import { createProceduralMalePlayer } from './resources/themes/mskba_dark/js/features/player-character-procedural-male.js';

          const baseState = {
            gender: 'male', heightCm: 185, weightKg: 84, bodyType: 'athletic',
            skinTone: 'light', hairstyle: 'male_fade', hairColor: 'dark_brown',
            facialHair: 'none', uniformKit: 'mskba_home',
          };

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          function validateGeometry(model) {
            model.traverse((object) => {
              if (!object.isMesh || !object.geometry) return;
              const position = object.geometry.getAttribute('position');
              assert(position && position.count > 0, `${object.name}: missing positions`);
              for (const value of position.array) {
                assert(Number.isFinite(value), `${object.name}: non-finite vertex`);
              }
              const index = object.geometry.getIndex();
              if (index) {
                for (const value of index.array) {
                  assert(value >= 0 && value < position.count, `${object.name}: invalid index ${value}`);
                }
              }
            });
          }

          for (const heightCm of [150, 185, 220]) {
            const model = createProceduralMalePlayer({ THREE }, { ...baseState, heightCm });
            const metric = model.userData.playerCharacterMetric;
            assert(metric?.floorY === 0, `floor datum is not zero at ${heightCm}`);
            assert(metric?.crownY === 1.79, `crown datum changed at ${heightCm}`);
            const scale = heightCm / 100 / (metric.crownY - metric.floorY);
            assert(Math.abs((metric.crownY - metric.floorY) * scale - heightCm / 100) < 1e-9, `height scale mismatch at ${heightCm}`);
            validateGeometry(model);

            const sole = model.getObjectByName('Procedural_Shoe_Sole');
            const soleBox = new THREE.Box3().setFromObject(sole);
            assert(Math.abs(soleBox.min.y) < 0.001, `shoe floor drift at ${heightCm}: ${soleBox.min.y}`);

            const shorts = [];
            model.traverse((object) => {
              if (/^Procedural_Shorts_/.test(object.name)) shorts.push(object.name);
            });
            assert(shorts.includes('Procedural_Shorts_Waist'), 'shorts waist missing');
            assert(shorts.includes('Procedural_Shorts_LeftLeg'), 'left shorts leg missing');
            assert(shorts.includes('Procedural_Shorts_RightLeg'), 'right shorts leg missing');

            const jersey = model.getObjectByName('Procedural_Jersey_Body');
            const jerseyBox = new THREE.Box3().setFromObject(jersey);
            assert(jerseyBox.min.y < 0.90, 'jersey hem is not long enough');
            assert(jerseyBox.max.y > 1.27, 'jersey body is too short');
          }

          for (const hairstyle of ['male_bald', 'male_buzz', 'male_fade', 'male_short', 'male_curls']) {
            const model = createProceduralMalePlayer({ THREE }, { ...baseState, hairstyle });
            const hairMeshes = [];
            model.traverse((object) => {
              if (object.isMesh && object.name.startsWith('MSKBA_Hair_')) hairMeshes.push(object);
            });
            assert(hairstyle === 'male_bald' ? hairMeshes.length === 0 : hairMeshes.length > 0, `${hairstyle}: hair mesh mismatch`);
            validateGeometry(model);
          }

          const fade = createProceduralMalePlayer({ THREE }, baseState);
          const curls = createProceduralMalePlayer({ THREE }, { ...baseState, hairstyle: 'male_curls' });
          const fadeBox = new THREE.Box3().setFromObject(fade);
          const curlsBox = new THREE.Box3().setFromObject(curls);
          assert(fadeBox.max.y > 1.79, 'fade should have visible volume above anatomical crown');
          assert(curlsBox.max.y > fadeBox.max.y, 'curls should change the head silhouette');

          console.log('Task 122 geometry contract OK', {
            fadeTop: fadeBox.max.y,
            curlsTop: curlsBox.max.y,
            crown: 1.79,
          });
          NODE
          node /tmp/task122-geometry.mjs

      - name: Render visual review sheet
        run: |
          cat > task122-preview.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <style>
              html,body{margin:0;background:#101310;color:#eee;font-family:Arial,sans-serif}
              body{padding:24px}
              h1{font-size:20px;margin:0 0 18px}
              .grid{display:grid;grid-template-columns:repeat(5,280px);gap:18px}
              .card{background:#161a16;border:1px solid #3a403a;border-radius:12px;padding:10px}
              .card strong{display:block;font-size:12px;margin-bottom:8px}
              canvas{display:block;width:260px;height:325px;background:linear-gradient(#171b17,#0d0f0d)}
            </style>
          </head>
          <body>
            <h1>Task 122 — male procedural visual review</h1>
            <div id="grid" class="grid"></div>
            <script type="module">
              import * as THREE from '/node_modules/three/build/three.module.js';
              import { createProceduralMalePlayer } from '/resources/themes/mskba_dark/js/features/player-character-procedural-male.js';

              const views = [
                ['fade front', 'male_fade', 0],
                ['fade -35°', 'male_fade', -35],
                ['fade +35°', 'male_fade', 35],
                ['buzz', 'male_buzz', 18],
                ['short', 'male_short', -18],
                ['bald', 'male_bald', 0],
                ['curls', 'male_curls', 18],
                ['large / shorts', 'male_fade', 32, 'large', 112],
                ['slim / jersey', 'male_fade', -32, 'slim', 65],
                ['muscular shoulders', 'male_short', 25, 'muscular', 92],
              ];

              const state = {
                gender:'male',heightCm:185,weightKg:84,bodyType:'athletic',skinTone:'light',
                hairstyle:'male_fade',hairColor:'dark_brown',facialHair:'none',uniformKit:'mskba_home'
              };

              for (const [label, hairstyle, yaw, bodyType = 'athletic', weightKg = 84] of views) {
                const card = document.createElement('div');
                card.className = 'card';
                const title = document.createElement('strong');
                title.textContent = label;
                const canvas = document.createElement('canvas');
                canvas.width = 520; canvas.height = 650;
                card.append(title, canvas); document.querySelector('#grid').append(card);

                const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
                renderer.setPixelRatio(1); renderer.setSize(520,650,false);
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1;

                const scene = new THREE.Scene();
                scene.add(new THREE.HemisphereLight(0xf8f2e8,0x151815,1.75));
                const key = new THREE.DirectionalLight(0xfff2df,2.65); key.position.set(2.2,3.1,3.8); scene.add(key);
                const fill = new THREE.DirectionalLight(0xbac8ff,0.92); fill.position.set(-2.4,2,2); scene.add(fill);
                const rim = new THREE.DirectionalLight(0xff9d42,0.62); rim.position.set(-1.2,2.8,-2.6); scene.add(rim);

                const camera = new THREE.OrthographicCamera(-1,1,1.25,-1.25,0.01,20);
                camera.position.set(0,1.25,4.2); camera.lookAt(0,1.25,0);

                const model = createProceduralMalePlayer({THREE},{...state,hairstyle,bodyType,weightKg});
                const metric = model.userData.playerCharacterMetric;
                model.scale.setScalar(1.85/(metric.crownY-metric.floorY));
                model.rotation.y = THREE.MathUtils.degToRad(yaw);
                scene.add(model);
                renderer.render(scene,camera);
              }

              window.task122Ready = true;
            </script>
          </body>
          </html>
          HTML

          cat > /tmp/task122-shot.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--use-angle=swiftshader'] });
          const page = await browser.newPage({ viewport: { width: 1540, height: 900 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/task122-preview.html', { waitUntil: 'networkidle' });
          await page.waitForFunction(() => window.task122Ready === true);
          await page.screenshot({ path: 'task-122-preview.png', fullPage: true });
          await browser.close();
          NODE

          python3 -m http.server 4173 >/tmp/task122-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node /tmp/task122-shot.mjs

      - name: Upload visual review sheet
        uses: actions/upload-artifact@v4
        with:
          name: task-122-preview
          path: task-122-preview.png
          retention-days: 1
