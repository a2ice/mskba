name: Inspect isolated dev deploy readiness (temporary)

on:
  push:
    branches:
      - feature/scroll-aware-header-context-bar
    paths:
      - .github/workflows/probe-mskba-dev.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect dev checkout and build services without writes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            ROOT=/var/www/mskba-dev-next
            test -f "$ROOT/.env"
            grep -Eq '^APP_URL=.*dev\.mskba\.ru' "$ROOT/.env" || { echo 'REFUSE_NOT_DEV'; exit 2; }
            cd "$ROOT"
            echo 'DEV_ROOT_CONFIRMED'
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=$(git branch --show-current)"
            echo "TRACKED_CHANGES=$(git status --porcelain -uno | wc -l)"
            echo "GIT_REMOTE_CONFIGURED=$(git remote | grep -cx origin || true)"
            echo "COMPOSE_BASE=$(test -f compose.yaml && echo yes || echo no)"
            echo "COMPOSE_PROD=$(test -f compose.prod.yaml && echo yes || echo no)"
            echo "APP_MANIFEST=$(test -f public/build/manifest.json && echo yes || echo no)"
            echo "APP_VENDOR=$(test -d vendor && echo yes || echo no)"
            echo 'TARGET_PATH_CHANGES_BEGIN'
            git status --short -- resources/themes/mskba_dark/js/features/sticky-header.js resources/themes/mskba_dark/css/header-sticky.css resources/themes/mskba_dark/views/partials/header.blade.php resources/themes/mskba_dark/css/pages/venue-sidebar-layout.css
            echo 'TARGET_PATH_CHANGES_END'
            echo 'RUNNING_COMPOSE_SERVICES_BEGIN'
            docker compose -f compose.yaml -f compose.prod.yaml ps --services --status running 2>&1 || true
            echo 'RUNNING_COMPOSE_SERVICES_END'
