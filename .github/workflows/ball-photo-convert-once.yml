name: Convert photographed basketball sprite (one-time)

on:
  push:
    branches:
      - feat/ball-photo-webp-linear-roll-20261017
    paths:
      - .github/workflows/ball-photo-convert-once.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install --disable-pip-version-check Pillow==11.2.1
      - name: Verify source sheet and convert each frame to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          src = Path('public/images/ball-16.png')
          dest = Path('public/images/ball-16.webp')
          with Image.open(src) as original:
              original.load()
              w, h = original.size
              print('SOURCE', {'dimensions': (w, h), 'mode': original.mode, 'bytes': src.stat().st_size})
              if (w, h) != (1254, 1254):
                  raise SystemExit('Expected 1254x1254 PNG; not replacing the sprite with a different asset')
              image = original.convert('RGBA')
              alpha_min, alpha_max = image.getchannel('A').getextrema()
              print('ALPHA_RANGE', (alpha_min, alpha_max))
              if alpha_min == alpha_max == 255:
                  raise SystemExit('PNG is fully opaque. Need transparent frames for the page')
              out = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
              stats = []
              for y in range(4):
                  for x in range(4):
                      x0, x1 = round(w*x/4), round(w*(x+1)/4)
                      y0, y1 = round(h*y/4), round(h*(y+1)/4)
                      tile = image.crop((x0,y0,x1,y1))
                      a = tile.getchannel('A')
                      bbox = a.getbbox()
                      if bbox is None:
                          raise SystemExit(f'Empty frame {y*4+x}')
                      occupancy = sum(v > 10 for v in a.resize((32,32)).getdata()) / (32*32)
                      stats.append({'frame':y*4+x, 'width': x1-x0,'height':y1-y0,'alpha_bbox':bbox,'coverage':round(occupancy,3)})
                      if occupancy < .07:
                          raise SystemExit(f'Frame {y*4+x} appears empty: {occupancy:.3f}')
                      out.paste(tile.resize((256,256), Image.Resampling.LANCZOS), (x*256,y*256))
              print('FRAME_STATS', stats)
              out.save(dest, format='WEBP', quality=93, method=6, exact=True, alpha_quality=100)
              with Image.open(dest) as verify:
                  verify.load()
                  assert verify.size == (1024,1024)
                  print('OUTPUT', {'dimensions':verify.size, 'mode':verify.mode,
                                   'bytes':dest.stat().st_size,
                                   'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),
                                   'percent_of_png':round(dest.stat().st_size/src.stat().st_size*100,1)})
          PY
      - name: Commit converted WebP only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/ball-photo-webp-linear-roll-20261017"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/ball-16.webp
          if git diff --cached --quiet; then
            echo "WebP has not changed"
          else
            git commit -m "assets(hero): convert photographed 16-frame PNG into WebP"
            git push origin HEAD:feat/ball-photo-webp-linear-roll-20261017
          fi
