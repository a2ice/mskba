name: Task 125 verification

on:
  push:
    branches:
      - feature/125

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Player Character feature tests
        run: |
          php artisan test tests/Feature/Identity/AccountPlayerCharacterStageTest.php
          php artisan test tests/Feature/Identity/AccountPlayerCharacterAppearanceTest.php

      - name: Blade compile
        run: |
          php artisan view:cache
          php artisan view:clear

      - name: JavaScript syntax
        run: |
          node --check resources/themes/mskba_dark/js/features/player-character-stage.js
          node --check resources/themes/mskba_dark/js/features/player-character-authored-renderer.js
          node --check resources/themes/mskba_dark/js/features/player-character-authored-model/part-01.js
          node --check resources/themes/mskba_dark/js/features/player-character-authored-model/part-02.js
          node --check resources/themes/mskba_dark/js/features/player-character-authored-model/part-03.js

      - name: Validate bundled GLB payload
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';

          const paths = [
            'resources/themes/mskba_dark/js/features/player-character-authored-model/part-01.js',
            'resources/themes/mskba_dark/js/features/player-character-authored-model/part-02.js',
            'resources/themes/mskba_dark/js/features/player-character-authored-model/part-03.js',
          ];
          const payload = paths.map((path) => {
            const source = fs.readFileSync(path, 'utf8');
            const match = source.match(/export default '([^']+)'/);
            if (!match) throw new Error(`Missing model payload in ${path}`);
            return match[1];
          }).join('');

          const glb = zlib.gunzipSync(Buffer.from(payload, 'base64'));
          if (glb.subarray(0, 4).toString('ascii') !== 'glTF') {
            throw new Error('Bundled payload is not a GLB file.');
          }
          if (glb.length < 25000) {
            throw new Error(`Unexpectedly small GLB payload: ${glb.length}`);
          }
          console.log(`Bundled GLB OK: ${glb.length} bytes`);
          NODE

      - name: Install frontend dependencies
        run: npm ci

      - name: Production frontend build
        run: npm run build
