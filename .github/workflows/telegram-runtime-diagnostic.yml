name: Telegram runtime diagnostic

on:
  push:
    branches:
      - diagnostic/telegram-webhook-runtime
    paths:
      - ".github/workflows/telegram-runtime-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check public webhook reachability
        shell: bash
        run: |
          set -u
          echo "=== public webhook probe from GitHub runner ==="
          STATUS="$(curl -4 -sS -o /tmp/telegram-webhook-probe.out -w '%{http_code}' --connect-timeout 8 --max-time 15 -X POST 'https://mskba.ru/api/integrations/telegram/webhook' -H 'Accept: application/json' -H 'Content-Type: application/json' --data '{}')" || true
          echo "HTTP ${STATUS:-curl_failed}"
          head -c 500 /tmp/telegram-webhook-probe.out 2>/dev/null || true
          echo

      - name: Inspect production Telegram runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -u
            cd /var/www/mskba
            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"

            echo "=== deployed revision ==="
            git rev-parse HEAD || true

            echo "=== telegram non-secret env ==="
            grep -E '^(TELEGRAM_UPDATES_TRANSPORT|TELEGRAM_QUEUE_CONNECTION|TELEGRAM_QUEUE_INBOUND|TELEGRAM_QUEUE_BACKGROUND|TELEGRAM_FORCE_IPV4)=' .env || true

            echo "=== compose services ==="
            $COMPOSE ps || true

            echo "=== HOST outbound comparison ==="
            for URL in https://api.telegram.org https://www.google.com https://github.com; do
              CODE="$(curl -4 -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$URL" 2>/dev/null || true)"
              echo "HOST $URL => ${CODE:-FAIL}"
            done
            for IP in 149.154.166.110 149.154.167.220 91.108.56.130 91.108.4.1 1.1.1.1 8.8.8.8; do
              RESULT="$(timeout 5 bash -lc "</dev/tcp/$IP/443" >/dev/null 2>&1 && echo OK || echo FAIL)"
              echo "HOST TCP $IP:443 => $RESULT"
            done

            echo "=== CONTAINER outbound comparison ==="
            for URL in https://api.telegram.org https://www.google.com https://github.com; do
              CODE="$($COMPOSE exec -T phpfpm sh -lc "curl -4 -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 '$URL'" 2>/dev/null || true)"
              echo "CONTAINER $URL => ${CODE:-FAIL}"
            done
            for IP in 149.154.166.110 149.154.167.220 91.108.56.130 91.108.4.1 1.1.1.1 8.8.8.8; do
              $COMPOSE exec -T phpfpm php -r '$ip=$argv[1];$t=microtime(true);$s=@fsockopen($ip,443,$errno,$errstr,4);$ms=(int)((microtime(true)-$t)*1000);echo "CONTAINER TCP ".$ip.":443 => ".(is_resource($s)?"OK":"FAIL")." {$ms}ms errno={$errno} {$errstr}".PHP_EOL;if(is_resource($s))fclose($s);' "$IP" || true
            done

            echo "=== HOST routing to Telegram vs generic ==="
            ip route get 149.154.166.110 || true
            ip route get 91.108.56.130 || true
            ip route get 1.1.1.1 || true

            echo "=== Telegram getWebhookInfo ==="
            $COMPOSE exec -T phpfpm php artisan tinker --execute='$r=app(\App\Modules\Telegram\Infrastructure\Services\TelegramBotApiClient::class)->call("getWebhookInfo"); $i=$r["result"]??[]; echo json_encode(["url"=>$i["url"]??null,"pending_update_count"=>$i["pending_update_count"]??null,"last_error_date"=>$i["last_error_date"]??null,"last_error_message"=>$i["last_error_message"]??null], JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;' || true

            echo "=== IPv6 host/container ==="
            ip -6 route || true
            CODE="$(curl -6 -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 https://api.telegram.org 2>/dev/null || true)"
            echo "HOST IPv6 Telegram => ${CODE:-FAIL}"
            CODE="$($COMPOSE exec -T phpfpm sh -lc "curl -6 -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 https://api.telegram.org" 2>/dev/null || true)"
            echo "CONTAINER IPv6 Telegram => ${CODE:-FAIL}"

            echo "=== webhook hits in container nginx ==="
            $COMPOSE logs --tail=1000 nginx 2>&1 | grep -F '/api/integrations/telegram/webhook' | tail -n 120 || true

            echo "=== inbound worker recent ==="
            $COMPOSE logs --tail=100 telegram-inbound-queue || true

            echo "=== Redis Telegram queue keys ==="
            $COMPOSE exec -T redis sh -lc 'redis-cli --scan --pattern "*queues*telegram*" | while read key; do printf "%s " "$key"; redis-cli TYPE "$key"; redis-cli LLEN "$key" 2>/dev/null || true; done' || true
