name: MSKBA authorized protected production cutover preparation
on:
  push:
    branches: [dev]
    paths: [.github/workflows/data-merge-cutover-prepare.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mskba-prod-cutover
  cancel-in-progress: false
jobs:
  prepare:
    name: Freeze original site, backup and connect staged merged DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate auditable release and rollback scripts
        run: |
          set -euo pipefail
          bash -n scripts/data-merge/prepare-production-cutover.sh
          bash -n scripts/data-merge/rollback-production-cutover.sh
      - name: Copy approved scripts to private production tools directory
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: scripts/data-merge/prepare-production-cutover.sh,scripts/data-merge/rollback-production-cutover.sh
          target: /home/deploy/mskba-cutover-tools/${{ github.run_id }}
      - name: Freeze, snapshot, preserve old media and stage new DB
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            bash /home/deploy/mskba-cutover-tools/${{ github.run_id }}/scripts/data-merge/prepare-production-cutover.sh
