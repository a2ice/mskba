name: Verify Task 113

on:
  push:
    branches:
      - fix/113-user-duplicate-merge-feedback

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run identity regression tests
        run: php artisan test tests/Feature/Identity/AdminUserDuplicateMergeTest.php tests/Feature/Identity/UserCanonicalizationTest.php tests/Feature/Identity/UserDuplicateAuditTest.php

      - name: Cache Blade views
        run: php artisan view:cache

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run full test suite
        run: php -d memory_limit=512M artisan test
