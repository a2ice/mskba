name: OpenAI player image smoke

on:
  push:
    branches:
      - test/openai-player-smoke
    paths:
      - '.github/workflows/openai-player-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate MSKBA player through OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY GitHub Actions secret is not configured." >&2
            exit 1
          fi

          cat > prompt.txt <<'EOF'
          Create exactly one photorealistic full-body adult male basketball player for a player-profile character UI.

          Physical parameters:
          - height: 185 cm
          - weight: 90 kg
          - athletic build, muscular but natural and realistic, not bodybuilder proportions
          - shaved/bald head with natural short facial stubble
          - realistic adult facial proportions and natural skin texture
          - white basketball shoes

          Uniform:
          - modern red basketball jersey and matching shorts
          - subtle dark navy accents
          - no logos, text, sponsor marks, team names or jersey number

          Composition:
          - one player only
          - completely visible head-to-toe
          - front-facing, standing upright in a relaxed neutral athletic pose
          - arms naturally relaxed alongside the body
          - centered vertical composition
          - comfortable transparent padding around the entire silhouette
          - realistic human anatomy, hands, feet and limb proportions
          - clean professional studio-quality lighting
          - face clearly visible, evenly lit and sharply detailed
          - realistic jersey fabric, skin, arms, legs and shoes
          - no ball, no floor, no scenery, no props, no extra people, no extra limbs
          - no text and no watermark

          Background/output:
          - isolate the player on a genuinely fully transparent background
          - do not create a white, gray, green or black backdrop
          - do not create a checkerboard transparency pattern
          - no cast shadow outside the player silhouette
          - output should look like a premium professional sports character photograph suitable for direct compositing into a dark basketball web UI
          EOF

          HTTP_STATUS="$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            https://api.openai.com/v1/images/generations \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @- <<JSON
          {
            "model": "gpt-image-2",
            "prompt": $(jq -Rs . < prompt.txt),
            "size": "1024x1536",
            "quality": "high",
            "background": "transparent",
            "output_format": "png",
            "n": 1
          }
          JSON
          )"

          jq 'if .error then {error: .error} else {created: .created, data_count: (.data | length), usage: .usage} end' \
            response.json > request-summary.json

          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "OpenAI image request failed with HTTP $HTTP_STATUS." >&2
            cat request-summary.json >&2
            exit 1
          fi

          jq -r '.data[0].b64_json // empty' response.json | base64 --decode > openai-player.png
          test -s openai-player.png
          file openai-player.png
          rm -f response.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: openai-player-smoke-${{ github.run_id }}
          path: |
            openai-player.png
            prompt.txt
            request-summary.json
          if-no-files-found: error
          retention-days: 1
