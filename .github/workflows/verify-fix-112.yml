name: Verify Fix 112

on:
  push:
    branches:
      - fix/112-recruitment-sync-toast
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test app/Modules/Event/Application/Services/GameAdmissionNotificationStateService.php app/Modules/Event/Presentation/Http/Controllers/StandaloneGameAdmissionController.php app/Modules/Event/Presentation/Http/Controllers/StandaloneGameQrJoinController.php app/Modules/Notification/Presentation/Presenters/UserNotificationPresenter.php app/Modules/Telegram/Application/UseCases/HandleEventParticipationCallback.php tests/Feature/Event/GameAdmissionNotificationSyncTest.php

      - name: Task 112 tests
        run: php artisan test tests/Feature/Event/GameAdmissionNotificationSyncTest.php

      - name: Recruitment regression
        run: php artisan test tests/Feature/Event/StandaloneGameRecruitmentWorkflowTest.php tests/Feature/Event/StandaloneGameQrJoinTest.php

      - name: Telegram participation regression
        env:
          TELEGRAM_BOT_USERNAME: MSKBABot
        run: php artisan test tests/Feature/Telegram/TelegramEventParticipationModeTest.php tests/Feature/Telegram/TelegramEventIntegrationTest.php

      - name: JavaScript syntax
        run: |
          node --check resources/themes/mskba_dark/js/features/notification-toasts.js
          node --check resources/themes/mskba_dark/js/features/standalone-game-recruitment.js

      - name: Frontend build
        run: |
          npm ci
          npm run build
