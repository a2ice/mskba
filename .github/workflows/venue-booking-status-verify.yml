name: Venue booking status verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check formatting
        run: vendor/bin/pint --test app/Modules/Venue/Presentation/Http/Controllers/VenueActivityController.php tests/Feature/Venue/VenueActivityFeedTest.php

      - name: Run venue activity tests
        run: php artisan test --compact tests/Feature/Venue/VenueActivityFeedTest.php tests/Feature/Venue/VenueShowPageTest.php

      - name: Install frontend dependencies
        run: npm ci

      - name: Production build
        run: npm run build
