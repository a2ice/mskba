name: Deploy to development

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # No deploy until the one-time VDS bootstrap and nginx cutover are complete.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'dev' &&
          vars.ENABLE_DEV_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy verified commit via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          envs: VERIFIED_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/mskba-dev
            test -f .env || { echo 'Dev .env missing'; exit 1; }
            grep -qx 'APP_THEME=mskba_app' .env
            grep -qx 'APP_URL=https://dev.mskba.ru' .env
            test -f .dev-bootstrap-complete || { echo 'Dev bootstrap marker missing'; exit 1; }
            case "$VERIFIED_SHA" in *[!0-9a-f]*|'') exit 1;; esac
            test "${#VERIFIED_SHA}" -eq 40
            git fetch origin dev
            test "$(git rev-parse origin/dev)" = "$VERIFIED_SHA" || {
              echo 'Verified commit no longer matches dev HEAD; skip older deployment'; exit 0;
            }
            test -z "$(git status --porcelain --untracked-files=no)" || {
              echo 'Server has tracked modifications; manual review required'; exit 1;
            }
            git reset --hard "$VERIFIED_SHA"
            COMPOSE='docker compose --env-file .env -f compose.dev.yaml'
            $COMPOSE config --quiet
            $COMPOSE build phpfpm
            $COMPOSE up -d db redis
            $COMPOSE run --rm -T phpfpm composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            $COMPOSE run --rm -T phpfpm php artisan migrate --force
            $COMPOSE run --rm -T phpfpm php artisan optimize:clear
            $COMPOSE up -d phpfpm reverb nginx
            curl --fail --silent --show-error --max-time 20 -H 'Host: dev.mskba.ru' http://127.0.0.1:8001/ > /dev/null
            echo 'Dev deployment completed; production untouched'
