name: GraphiQL npm lock generator (temporary)
on:
  push:
    branches:
      - feature/filament-graphiql-explorer-20261022
    paths:
      - .github/workflows/graphiql-lock-temp.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lock and verify build
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Commit updated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build(backoffice): lock GraphiQL React dependencies'
          git push origin HEAD:feature/filament-graphiql-explorer-20261022
