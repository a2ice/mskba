name: Wizard copy verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check copy module syntax
        run: node --check resources/themes/mskba_dark/js/features/event-wizard-copy.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Production build
        run: npm run build
