name: UI Studio end-to-end security smoke (read only)

on:
  push:
    branches: [ops/ui-studio-995-preflight]
    paths: [.github/workflows/ui-studio-browser-readiness.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Validate UI Studio iframe headers and Filament ticket route without access credentials
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            echo 'UI_STUDIO_BROWSER_READINESS_BEGIN'
            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "$headers" "$body"' EXIT

            code="$(curl --silent --show-error --connect-timeout 5 --max-time 15               -D "$headers" -o "$body" -w '%{http_code}' https://ui.mskba.ru/uikit/bridge)"
            echo "STUDIO_BRIDGE_STATUS=$code"
            test "$code" = 200
            grep -qF 'mskba-ui-studio:ready' "$body"
            grep -qF 'X-CSRF-TOKEN' "$body"
            echo 'STUDIO_BRIDGE_CONTENT=VALID'
            if grep -qi '^x-frame-options:' "$headers"; then
              echo 'STUDIO_FRAME_BLOCKER_X_FRAME_OPTIONS=PRESENT'
              exit 1
            fi
            csp="$(grep -i '^content-security-policy:' "$headers" | tail -n 1 | tr -d '\r' || true)"
            if printf '%s' "$csp" | grep -Fq "frame-ancestors 'self' https://mskba.ru https://dev.mskba.ru"; then
              echo 'STUDIO_FRAME_ANCESTORS=TRUSTED_DOMAINS'
            else
              echo 'STUDIO_FRAME_ANCESTORS=MISSING_OR_UNEXPECTED'
              exit 1
            fi
            if grep -i '^set-cookie:' "$headers" | grep -q 'mskba_ui_session'; then
              if grep -i '^set-cookie:' "$headers" | grep -i 'mskba_ui_session' | grep -Eqi 'secure.*httponly|httponly.*secure'; then
                echo 'STUDIO_COOKIE=ISOLATED_SECURE_HTTPONLY'
              else
                echo 'STUDIO_COOKIE=UNSAFE'
                exit 1
              fi
            else
              echo 'STUDIO_COOKIE=NOT_SET_ON_BRIDGE_GET'
            fi

            for route in /uikit /uikit/unified-chat /uikit/event-detail; do
              code="$(curl --silent --show-error --connect-timeout 5 --max-time 12 -o /dev/null -w '%{http_code}' "https://ui.mskba.ru$route")"
              echo "STUDIO_ANONYMOUS_$route=$code"
              test "$code" = 401
            done

            for route in /uikit/session /uikit/reviews; do
              code="$(curl --silent --show-error --connect-timeout 5 --max-time 12 -o /dev/null -w '%{http_code}' -X POST                 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{}' "https://ui.mskba.ru$route")"
              echo "STUDIO_CSRF_$route=$code"
              test "$code" = 419
            done

            echo '--- LIVE LARAVEL CONFIG ---'
            cd /var/www/mskba
            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"
            $COMPOSE exec -T phpfpm php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              if (config("ui-studio.issuer_enabled") !== true) throw new \RuntimeException("Issuer disabled");
              echo "PORTAL_ISSUER_ENABLED=TRUE\n";
              echo "PORTAL_STUDIO_ORIGIN=https://".config("ui-studio.host")."\n";
            '
            echo '--- FILAMENT STUDIO ROUTES ---'
            $COMPOSE exec -T phpfpm php artisan route:list --path=ui-studio || true
            $COMPOSE exec -T phpfpm php artisan route:list --path=backoffice || true
            $COMPOSE exec -T phpfpm php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(\\Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap();
              $matches=[];
              foreach (\\Illuminate\\Support\\Facades\\Route::getRoutes() as $r) {
                if (str_contains($r->uri(), "ui-studio")) {
                  $matches[]=$r->uri().":".$r->getName();
                }
              }
              foreach ($matches as $match) echo "STUDIO_ROUTE_REGISTERED=".$match."\\n";
              if (count($matches) < 2) exit(2);
            '
            echo 'UI_STUDIO_BROWSER_READINESS_SUCCESS'
