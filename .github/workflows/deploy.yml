name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/mskba
            sudo chown -R deploy:deploy .
            git fetch origin main
            git reset --hard origin/main

            docker compose up -d --build phpfpm db redis nginx

            sudo chown -R deploy:deploy public/build || true
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R ug+rwX storage bootstrap/cache

            docker compose exec phpfpm php artisan optimize:clear
            docker compose exec phpfpm php artisan migrate --force
            docker compose exec phpfpm php artisan config:cache
            docker compose restart phpfpm nginx
