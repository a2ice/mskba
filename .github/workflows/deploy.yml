name: Deploy to production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            cd /var/www/mskba

            if [ ! -f .env ]; then
              echo ".env is missing on production server" >&2
              exit 1
            fi

            if grep -q '^APP_DEBUG=true$' .env; then
              echo "APP_DEBUG=true is not allowed for production deploy" >&2
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"
            HOST_UID="$(id -u)"
            HOST_GID="$(id -g)"

            mkdir -p bootstrap/cache public/build

            $COMPOSE build phpfpm queue reverb scheduler telegram
            $COMPOSE up -d db redis

            $COMPOSE run -T --rm phpfpm composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader \
              </dev/null

            $COMPOSE --profile build run -T --rm node </dev/null
            test -f public/build/manifest.json
            $COMPOSE run -T --rm phpfpm chown -R "$HOST_UID:$HOST_GID" vendor public/build </dev/null || true

            $COMPOSE run -T --rm phpfpm sh -lc "mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && rm -f bootstrap/cache/*.php" </dev/null
            $COMPOSE run -T --rm phpfpm php artisan storage:link </dev/null
            $COMPOSE run -T --rm phpfpm php artisan migrate --force </dev/null
            $COMPOSE run -T --rm phpfpm php artisan telegram:sync-profile-avatars --missing </dev/null
            $COMPOSE run -T --rm phpfpm php artisan optimize:clear </dev/null
            $COMPOSE run -T --rm phpfpm php artisan config:cache </dev/null
            $COMPOSE run -T --rm phpfpm chown -R "$HOST_UID:www-data" storage bootstrap/cache </dev/null
            $COMPOSE run -T --rm phpfpm chmod -R ug+rwX storage bootstrap/cache </dev/null
            TELEGRAM_CONFIGURED=0
            for ATTEMPT in 1 2 3; do
              if $COMPOSE run -T --rm phpfpm php artisan telegram:configure-updates --if-configured </dev/null; then
                TELEGRAM_CONFIGURED=1
                break
              fi

              echo "Telegram API connection failed (attempt $ATTEMPT/3)." >&2
              sleep $((ATTEMPT * 5))
            done

            if [ "$TELEGRAM_CONFIGURED" -ne 1 ]; then
              echo "::warning::Telegram update configuration was skipped after three failed attempts." >&2
            fi

            $COMPOSE up -d --force-recreate phpfpm nginx queue reverb scheduler telegram

            $COMPOSE restart phpfpm nginx queue reverb scheduler telegram
