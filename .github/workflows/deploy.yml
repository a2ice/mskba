name: Deploy to production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            cd /var/www/mskba

            if [ ! -f .env ]; then
              echo ".env is missing on production server" >&2
              exit 1
            fi

            if grep -q '^APP_DEBUG=true$' .env; then
              echo "APP_DEBUG=true is not allowed for production deploy" >&2
              exit 1
            fi

            VK_ID_APP_ID='${{ vars.VK_ID_APP_ID }}'
            VK_ID_REDIRECT_URI='${{ vars.VK_ID_REDIRECT_URI }}'

            if [ -z "$VK_ID_APP_ID" ] || [ -z "$VK_ID_REDIRECT_URI" ]; then
              echo "VK ID repository variables are not configured" >&2
              exit 1
            fi

            update_env_value() {
              KEY="$1"
              VALUE="$2"

              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
              else
                printf '%s=%s\n' "$KEY" "$VALUE" >> .env
              fi
            }

            update_env_value VK_ID_APP_ID "$VK_ID_APP_ID"
            update_env_value VK_ID_REDIRECT_URI "$VK_ID_REDIRECT_URI"
            update_env_value FEATURE_VENUE_RENTAL_BOOKING_EVENTS true
            update_env_value TELEGRAM_QUEUE_CONNECTION redis
            update_env_value TELEGRAM_QUEUE_INBOUND telegram-inbound
            update_env_value TELEGRAM_QUEUE_BACKGROUND telegram-background
            update_env_value TELEGRAM_FORCE_IPV4 true

            # Production receives Telegram updates through the existing webhook
            # endpoint. Generate a stable per-server secret once when an older
            # production .env does not have one yet.
            TELEGRAM_WEBHOOK_SECRET="$(grep '^TELEGRAM_WEBHOOK_SECRET=' .env | tail -n 1 | cut -d= -f2- || true)"
            TELEGRAM_WEBHOOK_SECRET="${TELEGRAM_WEBHOOK_SECRET%\"}"
            TELEGRAM_WEBHOOK_SECRET="${TELEGRAM_WEBHOOK_SECRET#\"}"
            TELEGRAM_WEBHOOK_SECRET="${TELEGRAM_WEBHOOK_SECRET%\'}"
            TELEGRAM_WEBHOOK_SECRET="${TELEGRAM_WEBHOOK_SECRET#\'}"
            if [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
              TELEGRAM_WEBHOOK_SECRET="$(openssl rand -hex 32)"
              update_env_value TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
            fi
            update_env_value TELEGRAM_UPDATES_TRANSPORT webhook

            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"
            HOST_UID="$(id -u)"
            HOST_GID="$(id -g)"

            # Vite runs in a container and can leave tracked build artifacts
            # owned by a container user. Normalize them before git needs to
            # replace/remove those files on the next deployment.
            if [ -d public/build ]; then
              $COMPOSE run -T --rm --no-deps --user 0:0 phpfpm \
                chown -R "$HOST_UID:$HOST_GID" public/build </dev/null
            fi

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            mkdir -p bootstrap/cache public/build

            $COMPOSE build phpfpm queue telegram-inbound-queue telegram-background-queue reverb scheduler
            $COMPOSE up -d db redis

            $COMPOSE run -T --rm phpfpm composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader \
              </dev/null

            # npm occasionally loses the VDS outbound connection with ECONNRESET.
            # Retry the complete clean install + Vite build before treating that
            # transient network failure as a failed production deployment.
            NODE_BUILD_OK=0
            for ATTEMPT in 1 2 3; do
              if $COMPOSE --profile build run -T --rm node </dev/null; then
                NODE_BUILD_OK=1
                break
              fi

              echo "Frontend build failed (attempt $ATTEMPT/3)." >&2
              if [ "$ATTEMPT" -lt 3 ]; then
                sleep $((ATTEMPT * 5))
              fi
            done

            if [ "$NODE_BUILD_OK" -ne 1 ]; then
              echo "::error::Frontend build failed after 3 attempts." >&2
              exit 1
            fi

            test -f public/build/manifest.json
            $COMPOSE run -T --rm --no-deps --user 0:0 phpfpm \
              chown -R "$HOST_UID:$HOST_GID" vendor public/build </dev/null

            $COMPOSE run -T --rm phpfpm sh -lc "mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && rm -f bootstrap/cache/*.php" </dev/null
            $COMPOSE run -T --rm phpfpm php artisan storage:link </dev/null
            $COMPOSE run -T --rm phpfpm php artisan migrate --force </dev/null
            $COMPOSE run -T --rm phpfpm php artisan telegram:sync-profile-avatars --missing </dev/null
            $COMPOSE run -T --rm phpfpm php artisan optimize:clear </dev/null
            $COMPOSE run -T --rm phpfpm php artisan config:cache </dev/null
            $COMPOSE run -T --rm phpfpm chown -R "$HOST_UID:www-data" storage bootstrap/cache </dev/null
            $COMPOSE run -T --rm phpfpm chmod -R ug+rwX storage bootstrap/cache </dev/null

            # Bring the web application and queue workers up first. The old
            # polling container is intentionally left alive until Telegram has
            # accepted the webhook, so failed webhook configuration cannot make
            # inbound bot updates disappear.
            $COMPOSE up -d --force-recreate phpfpm nginx queue telegram-inbound-queue telegram-background-queue reverb scheduler

            $COMPOSE restart phpfpm nginx queue telegram-inbound-queue telegram-background-queue reverb scheduler

            sleep 2
            RUNNING_SERVICES="$($COMPOSE ps --status running --services)"
            for SERVICE in telegram-inbound-queue telegram-background-queue; do
              if ! printf '%s\n' "$RUNNING_SERVICES" | grep -qx "$SERVICE"; then
                echo "::error::Telegram queue worker $SERVICE is not running." >&2
                $COMPOSE ps >&2
                $COMPOSE logs --tail=100 "$SERVICE" >&2
                exit 1
              fi
            done

            REVERB_READY=0
            for ATTEMPT in $(seq 1 15); do
              if $COMPOSE exec -T reverb php -r '$socket = @fsockopen("127.0.0.1", 8080); exit($socket === false ? 1 : 0);'; then
                REVERB_READY=1
                break
              fi

              sleep 2
            done

            if [ "$REVERB_READY" -ne 1 ]; then
              $COMPOSE ps >&2
              $COMPOSE logs --tail=100 reverb >&2
              echo "Reverb did not become ready on port 8080." >&2
              exit 1
            fi

            # Re-resolve the upstream after Docker has recreated the Reverb
            # container and potentially assigned it a different network IP.
            $COMPOSE exec -T nginx nginx -s reload

            # Verify a real HTTP request through nginx -> PHP-FPM -> Laravel.
            # Any 1xx-4xx response means the application stack answered;
            # 5xx/502 or a connection failure must fail the deployment.
            HTTP_READY=0
            for ATTEMPT in $(seq 1 15); do
              if $COMPOSE exec -T phpfpm php -r '$socket = @fsockopen("nginx", 80, $errno, $errstr, 2); if ($socket === false) { exit(1); } fwrite($socket, "GET / HTTP/1.1\r\nHost: mskba.ru\r\nConnection: close\r\n\r\n"); $status = fgets($socket); fclose($socket); exit(is_string($status) && preg_match("/^HTTP\\/[0-9.]+ [1-4][0-9]{2}/", $status) === 1 ? 0 : 1);'; then
                HTTP_READY=1
                break
              fi

              sleep 2
            done

            if [ "$HTTP_READY" -ne 1 ]; then
              echo "::error::Application HTTP health check failed after deployment." >&2
              $COMPOSE ps >&2
              $COMPOSE logs --tail=150 phpfpm nginx >&2
              echo "--- Homepage render diagnostic ---" >&2
              $COMPOSE exec -T phpfpm php artisan tinker --execute='try { \App\Presentation\Theming\ThemeResolver::page("welcome"); fwrite(STDERR, "HOME_RENDER_OK\n"); } catch (\Throwable $e) { fwrite(STDERR, "HOME_RENDER_ERROR ".get_class($e).": ".$e->getMessage()."\n"); }' >&2 || true
              $COMPOSE exec -T phpfpm php artisan about >&2 || true
              exit 1
            fi

            # Switch only after the webhook endpoint is serving the new config.
            # Preserve pending updates. If Telegram cannot accept the webhook,
            # explicitly start polling and keep the successful website deploy.
            TELEGRAM_CONFIGURED=0
            for ATTEMPT in 1 2 3; do
              if $COMPOSE run -T --rm phpfpm php artisan telegram:configure-updates </dev/null; then
                TELEGRAM_CONFIGURED=1
                break
              fi

              echo "Telegram webhook configuration failed (attempt $ATTEMPT/3)." >&2
              sleep $((ATTEMPT * 5))
            done

            if [ "$TELEGRAM_CONFIGURED" -ne 1 ]; then
              echo "::group::Telegram IPv4 network diagnostic" >&2
              $COMPOSE run -T --rm phpfpm php -r '$host="api.telegram.org"; $ips=gethostbynamel($host) ?: []; fwrite(STDERR, "Resolved IPv4: ".($ips === [] ? "none" : implode(",", $ips)).PHP_EOL); foreach ($ips as $ip) { $started=microtime(true); $socket=@fsockopen($ip, 443, $errno, $errstr, 5); $ms=(int) round((microtime(true)-$started)*1000); if (is_resource($socket)) { fclose($socket); fwrite(STDERR, "TCP {$ip}:443 OK {$ms}ms".PHP_EOL); } else { fwrite(STDERR, "TCP {$ip}:443 FAIL {$ms}ms errno={$errno} {$errstr}".PHP_EOL); } }' </dev/null || true
              echo "::endgroup::" >&2

              update_env_value TELEGRAM_UPDATES_TRANSPORT polling
              $COMPOSE run -T --rm phpfpm php artisan optimize:clear </dev/null
              $COMPOSE run -T --rm phpfpm php artisan config:cache </dev/null
              $COMPOSE --profile polling up -d telegram

              sleep 2
              if ! $COMPOSE --profile polling ps --status running --services | grep -qx telegram; then
                echo "::error::Telegram webhook failed and polling fallback could not be started." >&2
                $COMPOSE --profile polling ps >&2
                $COMPOSE --profile polling logs --tail=100 telegram >&2
                exit 1
              fi

              echo "::warning::Telegram webhook could not be configured; production remains available with polling fallback." >&2
            else
              # Webhook is now authoritative. Remove the legacy long-poll process
              # so it cannot contend for getUpdates or create misleading failures.
              docker rm -f mskbanew-telegram >/dev/null 2>&1 || true
            fi
