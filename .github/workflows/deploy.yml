name: Deploy to production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deploy mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - light

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /var/www/mskba

            DEPLOY_MODE="${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'light' }}"
            GITHUB_BEFORE="${{ github.event.before }}"

            if [ ! -f .env ]; then
              echo ".env is missing on production server" >&2
              exit 1
            fi

            if grep -q '^APP_DEBUG=true$' .env; then
              echo "APP_DEBUG=true is not allowed for production deploy" >&2
              exit 1
            fi

            TARGET_DB_DATABASE="$(sed -n 's/^DB_DATABASE=//p' .env | tail -1 | tr -d '\"')"

            if [ "$TARGET_DB_DATABASE" = "mskba" ] && ! grep -q '^ALLOW_LEGACY_DB_DEPLOY=1$' .env && docker compose ps db >/dev/null 2>&1; then
              LEGACY_TABLES="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -Atc "select tablename from pg_tables where schemaname = '\''public'\'' order by tablename;"' || true)"

              if printf '%s\n' "$LEGACY_TABLES" | grep -Eq '^(contacts|contact_verifications|user_profiles)$'; then
                echo "Production database has legacy mskbanew schema. Resolve DB migration/reset strategy before deploy." >&2
                exit 1
              fi
            fi

            CURRENT_HEAD="$(git rev-parse HEAD 2>/dev/null || true)"

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            DEPLOY_SHA="$(git rev-parse HEAD)"
            BASE_SHA="$CURRENT_HEAD"

            if [ -n "$GITHUB_BEFORE" ] && [ "$GITHUB_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$GITHUB_BEFORE"
            fi

            if [ -n "$BASE_SHA" ] && git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
              CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$DEPLOY_SHA")"
            else
              CHANGED_FILES="$(git diff --name-only "$DEPLOY_SHA~1" "$DEPLOY_SHA" 2>/dev/null || true)"
            fi

            echo "Deploy mode: $DEPLOY_MODE"

            if [ "$DEPLOY_MODE" = "light" ] && printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(docker/|docker-compose\.prod\.yml|composer\.(json|lock)|package(-lock)?\.json|vite\.config\.[^/]+|resources/(css|js)/|resources/themes/[^/]+/(css|js)/)'; then
              echo "Light deploy cannot safely handle Docker, dependency, or frontend asset source changes. Run the workflow manually with deploy_mode=full." >&2
              printf '%s\n' "$CHANGED_FILES" >&2
              exit 1
            fi

            COMPOSE="docker compose -f docker-compose.prod.yml"
            HOST_UID="$(id -u)"
            HOST_GID="$(id -g)"

            mkdir -p bootstrap/cache public/build

            if [ "$DEPLOY_MODE" = "full" ]; then
              $COMPOSE build phpfpm
            fi

            $COMPOSE up -d db redis

            $COMPOSE run -T --rm phpfpm composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader \
              </dev/null

            if [ "$DEPLOY_MODE" = "full" ]; then
              rm -rf public/build
              $COMPOSE --profile build run -T --rm node </dev/null
              $COMPOSE run -T --rm phpfpm chown -R "$HOST_UID:$HOST_GID" vendor node_modules public/build </dev/null || true
            fi

            test -f public/build/manifest.json

            $COMPOSE run -T --rm phpfpm sh -lc "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && rm -f bootstrap/cache/*.php" </dev/null
            $COMPOSE run -T --rm phpfpm php artisan migrate --force </dev/null
            $COMPOSE run -T --rm phpfpm php artisan optimize:clear </dev/null
            $COMPOSE run -T --rm phpfpm php artisan config:cache </dev/null
            $COMPOSE run -T --rm phpfpm chown -R "$HOST_UID:www-data" storage bootstrap/cache </dev/null
            $COMPOSE run -T --rm phpfpm chmod -R ug+rwX storage bootstrap/cache </dev/null

            if [ "$DEPLOY_MODE" = "full" ]; then
              $COMPOSE up -d --force-recreate phpfpm nginx
            else
              $COMPOSE up -d phpfpm nginx
            fi

            $COMPOSE restart phpfpm nginx
