name: Test development SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh_smoke:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 5
    steps:
      - name: Read-only SSH connectivity test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -eu
            echo '=== IDENTITY ==='
            test "$(id -un)" = deploy
            whoami
            hostname
            echo '=== STAGING PATH ==='
            test -d /var/www/mskba-dev-next/.git
            test -r /var/www/mskba-dev-next/compose.dev.yaml
            echo 'Staging checkout readable'
            echo 'SSH READ-ONLY TEST PASSED'
