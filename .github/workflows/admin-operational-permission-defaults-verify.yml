name: Admin operational permission defaults verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check formatting
        run: vendor/bin/pint --test app/Modules/Identity/Application/Services/UserOperationalPermissionChecker.php app/Modules/Admin/Application/UseCases/ListAdminUsersHandler.php tests/Feature/Identity/AdminOperationalPermissionDefaultsTest.php

      - name: Verify operational permission behavior
        run: php artisan test --compact tests/Feature/Identity/AdminOperationalPermissionDefaultsTest.php tests/Feature/Identity/CreationOperationalPermissionTest.php tests/Feature/Admin/AdminUserManagementTest.php
