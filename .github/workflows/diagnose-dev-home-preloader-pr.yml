name: Diagnose DEV homepage preloader (temporary PR only)

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/diagnose-dev-home-preloader-pr.yml'
      - 'resources/themes/mskba_app/js/features/page-builder-native-lqip.js'

permissions:
  contents: read

jobs:
  inspect-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public homepage DOM and published Page Builder scripts
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, html.parser, re, urllib.parse
          url='https://dev.mskba.ru/?diagnose-preloader-ci=1'
          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':'MSKBA-Preloader-Diagnostic/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=25) as res:
                  return res.read().decode('utf-8','replace')
          body=get(url)
          print('HTML length:',len(body))
          class Scanner(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__();self.scripts=[];self.hot=[];self.images=[];self.actors=[];self.manifest=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs);name=' '.join(str(a.get(k,'')) for k in ('class','id','data-loading','data-preloader','data-page-loader'))
                  if any(x in name.lower() for x in ('loading','preload','loader','splash','overlay','ready')):
                      self.hot.append((tag,{k:v for k,v in a.items() if k in ('id','class','style','aria-hidden','hidden') or k.startswith('data-')}))
                  if tag=='a' and 'mskba-v3-actor-source' in a.get('class',''): self.actors.append({k:a.get(k) for k in ('class','href')})
                  if tag=='script' and a.get('src'):self.scripts.append(a['src'])
                  if tag=='script' and 'data-page-builder-lqip-manifest' in a:self.manifest=True
                  if tag=='img':
                      self.images.append({k:a.get(k) for k in ('class','id','src','data-mskba-lqip-full-src','loading') if a.get(k)})
          s=Scanner();s.feed(body)
          print('LOADING-RELATED HTML:',s.hot[:45])
          print('IMAGES:',s.images[:20])
          print('ACTOR SOURCES:',s.actors[:30])
          print('MANIFEST:',s.manifest)
          print('SCRIPTS:',s.scripts[:50])
          pattern=re.compile(r'(?:load(?:ing|er)?[\s_-]*layer|preloader|page[\s_-]*loader|imagesLoaded|Promise\.all|window\.addEventListener\([\x27\x22]load|document\.readyState|decode\(|document\.images|querySelectorAll\([\x27\x22]img|mskba:lqip|data-mskba-lqip)',re.I)
          for src in s.scripts:
              link=urllib.parse.urljoin(url,src)
              if urllib.parse.urlparse(link).netloc != 'dev.mskba.ru':continue
              try: js=get(link)
              except Exception as e:print('FETCH ERROR',link,str(e)[:140]);continue
              if '/page-builder/scripts/' not in link and not any(t in src for t in ('page-builder','app-')):continue
              matches=list(pattern.finditer(js))
              print('SCRIPT',link,'LENGTH',len(js),'MATCHES',len(matches))
              for m in matches[:32]:
                  print('MATCH',m.group(0),repr(js[max(0,m.start()-240):min(len(js),m.end()+360)]))
          PY
