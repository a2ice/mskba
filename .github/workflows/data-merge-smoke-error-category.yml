name: MSKBA isolated preview HTTP error category
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/data-merge-smoke-error-category.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Classify existing private Laravel log without revealing source data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import re
            from pathlib import Path
            root=Path('/home/deploy/mskba-data-merge-candidates/44068492554-web-smoke/storage/logs')
            print('private_logs_exist='+str(root.is_dir()).lower())
            lines=[]
            for file in root.glob('*.log'):
                if file.is_file():
                    lines.extend(file.read_text(errors='replace').splitlines())
            errors=[l for l in lines if '.ERROR:' in l]
            print('http_error_count='+str(len(errors)))
            if not errors:
                print('error_class=not_in_laravel_log')
                raise SystemExit(0)
            last=errors[-1]
            kinds=re.findall(r'[A-Za-z_]+(?:Exception|Error)',last)
            states=re.findall(r'SQLSTATE\\[([A-Z0-9]{5})\\]',last)
            print('error_classes='+(','.join(sorted(set(kinds))[:5]) if kinds else 'not_classified'))
            print('sqlstate_codes='+(','.join(sorted(set(states))[:3]) if states else 'none'))
            # Only print schema identifiers in canonical PostgreSQL error forms.
            # Never print SQL queries, values, identities, contacts or raw logs.
            for hint,pat in [
                ('missing_relation',r'(?i)relation "([a-z_][a-z0-9_]{1,70})" does not exist'),
                ('missing_column',r'(?i)column "([a-z_][a-z0-9_]{1,70})" does not exist'),
                ('missing_table_alias',r'(?i)missing FROM-clause entry for table "([a-z_][a-z0-9_]{1,70})"'),
                ('missing_function',r'(?i)function ([a-z_][a-z0-9_]{1,70})\\('),
                ('missing_operator',r'(?i)operator does not exist: ([a-z_][a-z0-9_]{1,70})'),
            ]:
                m=re.search(pat,last)
                if m:
                    print(hint+'='+m.group(1))
            if '42P01' in states or '42703' in states:
                print('classification=missing_db_relation_or_column')
            elif '23502' in states or '23503' in states or '23505' in states:
                print('classification=integrity_constraint')
            elif '22P02' in states:
                print('classification=invalid_cast')
            elif '08006' in states or '08001' in states:
                print('classification=db_connection')
            tags={
             'database_connection':'could not connect|connection refused|Name or service not known',
             'redis':'RedisException|Redis connection|redis',
             'view_error':'ViewException|Undefined variable|Undefined array key',
             'encryption':'encryption key|DecryptException|The MAC is invalid',
             'assets':'Vite manifest|Unable to locate file',
             'filesystem':'Permission denied|No such file or directory',
             'sql_schema':'does not exist|Undefined table|undefined column',
            }
            for name,pattern in tags.items():
                if re.search(pattern,last,re.I):
                    print('error_category='+name)
            PY
