name: UI Studio infrastructure preflight (read only)

on:
  push:
    branches:
      - ops/ui-studio-995-preflight
    paths:
      - '.github/workflows/ui-studio-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify SSH reachability and UI Studio readiness without changing production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo 'UI_STUDIO_PREFLIGHT=STARTED'
            echo '--- DNS ---'
            if getent ahostsv4 ui.mskba.ru >/dev/null 2>&1; then
              echo 'UI_DNS_IPV4=FOUND'
            else
              echo 'UI_DNS_IPV4=NOT_FOUND'
            fi

            echo '--- HTTPS ---'
            STATUS="$(curl --silent --show-error --max-time 8 --output /dev/null --write-out '%{http_code}' https://ui.mskba.ru/uikit 2>/dev/null || true)"
            case "$STATUS" in
              200|301|302|303|307|308|401|403|404) echo "UI_HTTPS=RESPONDING_HTTP_${STATUS}" ;;
              000|'') echo 'UI_HTTPS=UNREACHABLE_OR_TLS_ERROR' ;;
              *) echo "UI_HTTPS=HTTP_${STATUS}" ;;
            esac

            echo '--- RESOURCES ---'
            free -m | awk '/^Mem:/ { print "RAM_TOTAL_MB=" $2; print "RAM_AVAILABLE_MB=" $7 }'
            df -Pm /var/www | awk 'NR==2 {print "DISK_AVAILABLE_MB=" $4}'
            if command -v docker >/dev/null 2>&1; then
              RUNNING="$(docker ps --format '{{.Names}}' 2>/dev/null | wc -l || true)"
              echo "DOCKER_RUNNING_CONTAINERS=${RUNNING}"
            else
              echo 'DOCKER=UNAVAILABLE'
            fi

            echo '--- READ ONLY HOST CHECKS ---'
            for directory in /var/www/mskba /var/www/mskba-dev-next /var/www/mskba-ui /var/www/ui.mskba.ru; do
              if [ -d "$directory" ]; then
                echo "DIRECTORY_${directory}=EXISTS"
              else
                echo "DIRECTORY_${directory}=ABSENT"
              fi
            done
            for path in /etc/letsencrypt/live/ui.mskba.ru/fullchain.pem /etc/nginx/sites-enabled/ui.mskba.ru.conf; do
              if [ -e "$path" ]; then
                echo "FILE_${path}=EXISTS"
              else
                echo "FILE_${path}=ABSENT_OR_UNREADABLE"
              fi
            done
            if [ -d /etc/nginx/sites-enabled ]; then
              if grep -Rql --include='*.conf' -F 'ui.mskba.ru' /etc/nginx/sites-enabled 2>/dev/null; then
                echo 'NGINX_UI_VHOST=CONFIG_PRESENT'
              else
                echo 'NGINX_UI_VHOST=NOT_FOUND_OR_UNREADABLE'
              fi
            else
              echo 'NGINX_UI_VHOST=HOST_CONFIGURATION_UNAVAILABLE'
            fi
            echo '--- EXISTING UI STUDIO CHECKOUT ---'
            STUDIO_ROOT=/var/www/mskba-ui
            if [ -d "$STUDIO_ROOT" ]; then
              for file in artisan composer.json composer.lock package-lock.json .env; do
                if [ -f "$STUDIO_ROOT/$file" ]; then
                  echo "STUDIO_FILE_$file=PRESENT"
                else
                  echo "STUDIO_FILE_$file=ABSENT"
                fi
              done
              for dir in vendor public/build storage bootstrap/cache .git; do
                if [ -d "$STUDIO_ROOT/$dir" ]; then
                  echo "STUDIO_DIRECTORY_$dir=PRESENT"
                else
                  echo "STUDIO_DIRECTORY_$dir=ABSENT"
                fi
              done
              if [ -d "$STUDIO_ROOT/.git" ]; then
                echo "STUDIO_GIT_HEAD=$(git -C "$STUDIO_ROOT" rev-parse --short HEAD 2>/dev/null || echo unreadable)"
                echo "STUDIO_GIT_BRANCH=$(git -C "$STUDIO_ROOT" branch --show-current 2>/dev/null || echo unreadable)"
                if [ -z "$(git -C "$STUDIO_ROOT" status --porcelain 2>/dev/null)" ]; then
                  echo 'STUDIO_WORKTREE=CLEAN'
                else
                  echo 'STUDIO_WORKTREE=DIRTY_OR_UNREADABLE'
                fi
              fi
              if [ -f "$STUDIO_ROOT/.env" ]; then
                for expected in 'APP_ENV=ui-studio' 'UI_STUDIO_ENABLED=true' 'UI_STUDIO_HOST=ui.mskba.ru' 'SESSION_DRIVER=file' 'CACHE_STORE=file' 'APP_DEBUG=false'; do
                  key="$(printf '%s' "$expected" | cut -d= -f1)"
                  if grep -Fqx "$expected" "$STUDIO_ROOT/.env" 2>/dev/null; then
                    echo "STUDIO_ENV_$key=EXPECTED"
                  else
                    echo "STUDIO_ENV_$key=DIFFERENT_OR_ABSENT"
                  fi
                done
                for key in APP_KEY UI_STUDIO_USER UI_STUDIO_PASSWORD_HASH UI_STUDIO_BRIDGE_SECRET; do
                  if grep -Eq "^$key=.{12,}$" "$STUDIO_ROOT/.env" 2>/dev/null; then
                    echo "STUDIO_SECRET_$key=PRESENT"
                  else
                    echo "STUDIO_SECRET_$key=ABSENT_OR_UNREADABLE"
                  fi
                done
              fi
              if [ -d "$STUDIO_ROOT/storage" ]; then
                echo "STUDIO_STORAGE_OWNER=$(stat -c '%U:%G' "$STUDIO_ROOT/storage")"
                echo "STUDIO_STORAGE_MODE=$(stat -c '%a' "$STUDIO_ROOT/storage")"
              fi
            fi
            echo '--- HTTP HEADERS ---'
            curl --silent --show-error --max-time 8 --head https://ui.mskba.ru/uikit 2>/dev/null \
              | grep -Ei '^(HTTP/|www-authenticate:|x-frame-options:|content-security-policy:)' \
              | cut -c1-190 || true
            echo '--- STUDIO CONTAINERS ---'
            docker ps --format '{{.Names}}' 2>/dev/null | grep -Ei 'ui|studio' || echo 'STUDIO_RUNNING_CONTAINERS=NONE_MATCHED'
            echo '--- UI PREVIEW DEPLOY SAFETY ---'
            STUDIO_ROOT=/var/www/mskba-ui
            if [ -d "$STUDIO_ROOT/.git" ]; then
              echo "STUDIO_GIT_REMOTE_MAIN_AHEAD=$(git -C "$STUDIO_ROOT" rev-list --count HEAD..origin/main 2>/dev/null || echo unavailable)"
              echo "STUDIO_GIT_SOURCE_STATUS_BEGIN"
              git -C "$STUDIO_ROOT" status --short --untracked-files=no -- . ':(exclude)public/build/**' \
                | head -n 25 || true
              echo "STUDIO_GIT_SOURCE_STATUS_END"
            fi
            for value in 'SESSION_DRIVER=array' 'SESSION_DRIVER=file' 'CACHE_STORE=array' 'CACHE_STORE=file'; do
              name="$(printf '%s' "$value" | tr '= ' '__')"
              if grep -Fqx "$value" "$STUDIO_ROOT/.env" 2>/dev/null; then
                echo "STUDIO_SETTING_$name=YES"
              else
                echo "STUDIO_SETTING_$name=NO"
              fi
            done
            if docker inspect mskba-ui-php >/dev/null 2>&1; then
              echo "STUDIO_CONTAINER_NETWORK=$(docker inspect --format '{{.HostConfig.NetworkMode}}' mskba-ui-php)"
              echo "STUDIO_CONTAINER_STATUS=$(docker inspect --format '{{.State.Status}}' mskba-ui-php)"
              docker exec mskba-ui-php php artisan route:list --path=uikit 2>&1 | tail -n 12 || true
            else
              echo 'STUDIO_CONTAINER=NOT_FOUND'
            fi
            echo '--- NEW STUDIO ENDPOINTS AND WRITABILITY ---'
            for method in GET POST; do
              if [ "$method" = POST ]; then
                status="$(curl --silent --show-error --max-time 8 --output /dev/null --write-out '%{http_code}' -X POST -H 'Accept: application/json' --data '{}' https://ui.mskba.ru/uikit/session 2>/dev/null || true)"
                echo "STUDIO_SESSION_POST_STATUS=$status"
              else
                status="$(curl --silent --show-error --max-time 8 --output /dev/null --write-out '%{http_code}' https://ui.mskba.ru/uikit/bridge 2>/dev/null || true)"
                echo "STUDIO_BRIDGE_GET_STATUS=$status"
              fi
            done
            if docker inspect mskba-ui-php >/dev/null 2>&1; then
              user="$(docker inspect --format '{{.Config.User}}' mskba-ui-php)"
              echo "STUDIO_CONFIGURED_CONTAINER_USER=$(test -n "$user" && echo explicit || echo default)"
              docker exec mskba-ui-php sh -lc 'for path in storage/framework/sessions storage/framework/cache storage/app/private; do if [ -d "$path" ]; then echo "CONTAINER_DIRECTORY_$path=EXISTS"; else echo "CONTAINER_DIRECTORY_$path=MISSING"; fi; if [ -w "$path" ]; then echo "CONTAINER_WRITABLE_$path=YES"; else echo "CONTAINER_WRITABLE_$path=NO"; fi; done' || true
            fi
            echo '--- PROXY CONFIG LOCATION, NO SECRET OUTPUT ---'
            docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null | grep -Ei 'nginx|caddy|proxy|traefik|mskba-ui' | head -n 25 || true
            for dir in /etc/nginx /var/www/mskba-ui-runtime /var/www/mskba-ui; do
              if [ -d "$dir" ]; then
                find "$dir" -maxdepth 4 -type f \( -name '*.conf' -o -name 'compose*.yml' -o -name 'Caddyfile' \) 2>/dev/null \
                  | grep -Ev '/(vendor|node_modules|\.git)/' | head -n 30
              fi
            done
            echo '--- HOST NGINX DIRECTIVES (NON-SECRET) ---'
            if [ -d /etc/nginx ]; then
              echo 'NGINX_SITE_FILES_BEGIN'
              find /etc/nginx/sites-enabled /etc/nginx/sites-available -maxdepth 1 \( -type f -o -type l \) 2>/dev/null | head -n 30 || true
              echo 'NGINX_SITE_FILES_END'
              found="$(grep -RilF 'ui.mskba.ru' /etc/nginx 2>/dev/null | head -n 10 || true)"
              if [ -z "$found" ]; then
                echo 'UI_NGINX_CONFIG=UNREADABLE_OR_UNMATCHED'
              else
                printf '%s\n' "$found" | while IFS= read -r path; do
                  echo "MATCHED_NGINX_CONFIG=$path"
                  grep -nE 'server_name|auth_basic|limit_except|location|deny |allow ' "$path" 2>/dev/null | cut -c1-150 | head -n 45 || true
                done
              fi
            fi
            echo 'UI_STUDIO_PREFLIGHT=FINISHED'
