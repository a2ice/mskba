services:
  phpfpm:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php-fpm"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpfpm
      - reverb

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_started
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]

  telegram:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php", "artisan", "telegram:poll-updates"]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mskbabrandnew}
      POSTGRES_USER: ${DB_USERNAME:-mskbabrandnew}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mskbabrandnew} -d ${DB_DATABASE:-mskbabrandnew}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data:
