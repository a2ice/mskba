server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64m;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reusable public images retain browser freshness on repeat navigation.
    # Do not use immutable: these legacy static paths can be replaced in-place.
    location ~* \\.(?:avif|webp|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    # Vite output is content-hashed, so keeping it indefinitely is safe.
    location ^~ /build/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The host-level reverse proxy may not preserve the Upgrade header.
        # This location is WebSocket-only, so restore it explicitly here.
        proxy_set_header Upgrade websocket;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://reverb:8080;
    }

    location /apps {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://reverb:8080;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass phpfpm:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
