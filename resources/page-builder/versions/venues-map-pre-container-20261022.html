<section class="mskba-venues-map">
  <div class="mskba-venues-map__canvas" id="mskba-venues-map-canvas"></div>
  <div class="mskba-venues-map__scrim"></div>

  <div class="container mskba-venues-map__container">
    <div class="mskba-venues-map__copy">
      <p class="mskba-venues-map__eyebrow">КАРТА ПЛОЩАДОК</p>
      <h2 class="mskba-venues-map__title">НАЙДИ СВОЮ<br>ПЛОЩАДКУ</h2>
      <p class="mskba-venues-map__description">Интерактивная карта баскетбольных площадок Москвы. Удобный поиск, фильтры по районам, удобствам и типам покрытий.</p>

      <div class="mskba-venues-map__features">
        <div class="mskba-venues-map__feature"><span class="mskba-venues-map__feature-icon" aria-hidden="true"></span><span>Карта<br>площадок</span></div>
        <div class="mskba-venues-map__feature"><span class="mskba-venues-map__feature-icon" aria-hidden="true"></span><span>Фильтры<br>по удобствам</span></div>
        <div class="mskba-venues-map__feature"><span class="mskba-venues-map__feature-icon" aria-hidden="true"></span><span>Рейтинги<br>и отзывы</span></div>
        <div class="mskba-venues-map__feature"><span class="mskba-venues-map__feature-icon" aria-hidden="true"></span><span>Расписание<br>и бронирование</span></div>
      </div>
      <a class="mskba-venues-map__cta" href="/venues">Открыть карту <span>→</span></a>
      <p class="mskba-venues-map__status" id="mskba-venues-map-status" role="status" aria-live="polite">Загружаем площадки…</p>
    </div>

    <div class="mskba-venues-map__card-anchor" id="mskba-venues-map-card" hidden></div>
    <div class="mskba-venues-map__filters" id="mskba-venues-map-filters" role="group" aria-label="Фильтры площадок"></div>
  </div>
</section>
