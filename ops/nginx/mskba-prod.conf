# Host-level production Nginx for mskba.ru.
# TLS terminates here; Docker Nginx remains HTTP-only on 127.0.0.1:8000.
#
# Canonical URL policy:
#   http://mskba.ru/*      -> https://mskba.ru/*
#   http://www.mskba.ru/*  -> https://mskba.ru/*
#   https://www.mskba.ru/* -> https://mskba.ru/*
#   https://mskba.ru/*     -> application (200/normal app response)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mskba.ru;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/mskba.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mskba.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mskba.ru;

    ssl_certificate /etc/letsencrypt/live/mskba.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mskba.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mskba.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mskba.ru www.mskba.ru;

    return 301 https://mskba.ru$request_uri;
}
